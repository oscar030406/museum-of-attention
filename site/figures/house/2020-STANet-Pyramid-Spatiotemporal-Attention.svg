<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="prep" d="M 469 526 L 469 504" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="prep" data-to="qk" d="M 406 448 L 276 415" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="prep" data-to="v" d="M 534 448 L 682 415" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="qk" data-to="score" d="M 276 359 L 276 322.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="score" data-to="mix" d="M 276 249.5 L 410 228" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="v" data-to="mix" d="M 682 359 L 558 228" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="mix" data-to="repack" d="M 484 186 L 484 159" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="repack" data-to="out" d="M 484 103 L 484 67" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<g class="node" id="x"><rect x="348" y="526" width="242" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="469" y="552.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Width-concatenated time pair</text>
</g>
<g class="node" id="prep"><rect x="342.5" y="448" width="253" height="56" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="469" y="472.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">One branch per grid scale s</text>
<text x="469" y="490.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Optional average pooling</text>
</g>
<g class="node" id="qk"><rect x="140" y="359" width="272" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="276" y="383.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Conv 1×1 + BatchNorm → Q and K</text>
<text x="276" y="401.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Split times, tile each into s×s windows</text>
</g>
<g class="node" id="v"><rect x="548" y="359" width="268" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="682" y="383.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Conv 1×1 → V</text>
<text x="682" y="401.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Split times, tile each into s×s windows</text>
</g>
<g class="node" id="score"><rect x="153" y="249.5" width="246" height="73" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="276" y="273.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Joint-window attention</text>
<text x="276" y="291.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Flatten both times per window</text>
<text x="276" y="309.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Softmax(QKᵀ / √d) over keys</text>
</g>
<g class="node" id="mix"><rect x="366" y="186" width="236" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="484" y="212.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Combine values across both times</text>
</g>
<g class="node" id="repack"><rect x="369.5" y="103" width="229" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="484" y="127.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Stitch windows, join time halves</text>
<text x="484" y="145.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Upsample if pooled</text>
</g>
<g class="node" id="out"><rect x="338.5" y="25" width="291" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="484" y="42.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Concat scales + Conv 1×1</text>
<text x="484" y="60.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Fused pair of feature maps</text>
</g>
<text x="479.0" y="520.0" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--prep">B×C×H×(2W)</text>
<text x="286.0" y="345.75" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge qk--score">Q, K: Bs²×L×d</text>
<text x="353.0" y="243.75" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge score--mix">Bs²×L×L</text>
<text x="630.0" y="298.5" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge v--mix">V: Bs²×C′×L</text>
<text x="494.0" y="177.5" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge mix--repack">Bs²×C′×L</text>
<text x="494.0" y="90.0" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge repack--out">B×C′×H×(2W) per scale</text>
<text x="752" y="285" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="note">L = 2 × window area</text>
</svg>
