<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-i" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="pair" data-to="bias" d="M 147 522 L 147 460.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-g)"/>
<path class="flow" data-from="q0" data-to="keys" d="M 419 522 L 434 477.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="q0" data-to="ad" d="M 491 522 L 592 490 L 592 417 L 636 383.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="cond" data-to="ad" d="M 772 512.5 L 737 383.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-g)"/>
<path class="flow" data-from="keys" data-to="ad" d="M 434 422.5 L 493 383.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="bias" data-to="score" d="M 222 405.5 L 222 307 L 334 282.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-g)"/>
<path class="flow" data-from="mask" data-to="score" d="M 115 319.5 L 133 308 L 261 282.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-g)"/>
<path class="flow" data-from="ad" data-to="score" d="M 533 328.5 L 471 282.5" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-i)"/>
<path class="flow" data-from="ad" data-to="mix" d="M 710 328.5 L 781 300 L 781 211 L 636 190.5" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-i)"/>
<path class="flow" data-from="score" data-to="mix" d="M 391 227.5 L 441 190.5" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<path class="flow" data-from="mix" data-to="out" d="M 523 135.5 L 523 92.5" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<g class="node" id="pair"><rect x="70" y="522" width="154" height="36" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="147" y="545" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Pair conditions</text>
</g>
<g class="node" id="q0"><rect x="366" y="522" width="180" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="456" y="545" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Atom query subsets</text>
</g>
<g class="node" id="cond"><rect x="643.5" y="512.5" width="257" height="55" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="772" y="535.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Single-atom conditions</text>
<text class="box" x="772" y="554.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Separate query and key tensors</text>
</g>
<g class="node" id="bias"><rect x="32" y="405.5" width="230" height="55" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="147" y="428.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">LayerNorm → Linear</text>
<text class="box" x="147" y="447.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">One bias per block and head</text>
</g>
<g class="node" id="keys"><rect x="305" y="422.5" width="258" height="55" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="434" y="445.5" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Gather local keys and mask</text>
<text class="box" x="434" y="464.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Index across all subsets</text>
</g>
<g class="node" id="ad"><rect x="427" y="328.5" width="356" height="55" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text class="box" x="605" y="351.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Adaptive LayerNorm → Linear Q, K, V</text>
<text class="box" x="605" y="370.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Condition scale and shift on single atoms</text>
</g>
<g class="node" id="mask"><rect x="28.5" y="319.5" width="173" height="55" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="115" y="342.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Query and key masks</text>
<text class="box" x="115" y="361.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">10⁹ × (mQ − 1) × (mK − 1)</text>
</g>
<g class="node" id="score"><rect x="224.5" y="227.5" width="333" height="55" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="391" y="250.5" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Scaled QKᵀ + pair and mask terms</text>
<text class="box" x="391" y="269.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Softmax over local keys</text>
</g>
<g class="node" id="mix"><rect x="357" y="135.5" width="332" height="55" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="523" y="158.5" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Mix V, apply query sigmoid gate</text>
<text class="box" x="523" y="177.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Project and gate with single condition</text>
</g>
<g class="node" id="out"><rect x="338.5" y="37.5" width="369" height="55" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="523" y="60.5" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Add attention to original atom queries</text>
<text class="box" x="523" y="79.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Residual adaptive norm → SiLU gate → Linear</text>
</g>
<text class="edge pair--bias" x="153" y="495" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">G×Q×K×P</text>
<text class="edge q0--keys" x="436" y="504" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">G×Q×C</text>
<text class="edge q0--ad" x="552" y="519" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">Queries</text>
<text class="edge cond--ad" x="761" y="453" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">Single conditions</text>
<text class="edge keys--ad" x="472" y="410" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">G×K×C</text>
<text class="edge bias--score" x="224" y="319" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">G×h×Q×K</text>
<text class="edge mask--score" x="159" y="284" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">G×1×Q×K</text>
<text class="edge ad--score" x="509" y="306" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">Q, K</text>
<text class="edge ad--mix" x="716" y="196" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">V and query gate</text>
<text class="edge score--mix" x="426" y="221" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">G×h×Q×K</text>
<text class="edge mix--out" x="529" y="110" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">G×Q×C</text>
<text class="note" x="781" y="109" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Repeat for each atom block</text>
</svg>
