<text x="486" y="176" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge i--k">B×C×H×W</text>
<text x="481" y="97" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge k--y">B×C×H×W</text>
</svg>
