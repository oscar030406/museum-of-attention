</g>
<g class="node" id="g"><rect x="634.5" y="526" width="185" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="727" y="552.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Second feature map G</text>
</g>
<g class="node" id="l"><rect x="187" y="436" width="222" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="298" y="460.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Local Conv 3×3 twice</text>
<text x="298" y="478.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">DW then dilation 2, Conv 1×1</text>
</g>
<g class="node" id="r"><rect x="547.5" y="436" width="235" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="665" y="460.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Channel mean and max</text>
<text x="665" y="478.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Concat + Conv 1×1 + BN</text>
</g>
<g class="node" id="m"><rect x="351" y="353" width="258" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="480" y="377.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Broadcast add + BN</text>
<text x="480" y="395.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Conv 1×1 + Softmax over paths</text>
</g>
<g class="node" id="w"><rect x="372.5" y="270" width="215" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="480" y="294.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Residual reweighting</text>
<text x="480" y="312.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">X′ = (1 + a)X, G′ = (1 + b)G</text>
</g>
<g class="node" id="i"><rect x="343" y="188" width="274" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="480" y="212.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Cross gate and multiply</text>
<text x="480" y="230.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">[X′ × Sigmoid(G′)] × [G′ × Sigmoid(X′)]</text>
</g>
<g class="node" id="k"><rect x="367" y="112" width="226" height="42" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="480" y="138.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Conv 1×1 + BN + Sigmoid</text>
</g>
<g class="node" id="y"><rect x="319" y="29" width="260" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="449" y="55.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Scale X + Conv 1×1 + BN</text>
</g>
