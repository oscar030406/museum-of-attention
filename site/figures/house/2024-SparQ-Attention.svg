<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="qkv" data-to="pick" d="M 480 531 L 265 491" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="qkv" data-to="mean" d="M 502 531 L 834 500 L 834 331 L 676 326" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="qkv" data-to="size" d="M 458 531 L 60 506 L 60 340 L 254 317" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="pick" data-to="rank" d="M 265 439 L 265 409" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="rank" data-to="size" d="M 254 357 L 276 317" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="rank" data-to="mean" d="M 276 357 L 654 326" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="size" data-to="full" d="M 254 283 L 265 243" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="size" data-to="mix" d="M 276 283 L 463 259 L 463 186 L 475 161" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="mean" data-to="mix" d="M 665 274 L 497 161" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="full" data-to="w" d="M 254 191 L 133 186 L 170 69" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="full" data-to="mix" d="M 276 191 L 453 161" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="mix" data-to="out" d="M 475 109 L 475 69" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<g class="node" id="qkv"><rect x="332.5" y="531" width="295" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="553.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Group Q, K, V and mask by KV head</text>
</g>
<g class="node" id="pick"><rect x="149" y="439" width="232" height="52" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="265" y="461.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Select large query channels</text>
<text x="265" y="479.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Approximate QKᵀ + mask</text>
</g>
<g class="node" id="rank"><rect x="150.5" y="357" width="229" height="52" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="265" y="379.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Prioritize nearby keys</text>
<text x="265" y="397.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Rank jointly within each KV group</text>
</g>
<g class="node" id="size"><rect x="158" y="283" width="214" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="265" y="305.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Gather full K, V and mask</text>
</g>
<g class="node" id="mean"><rect x="563.5" y="274" width="203" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="665" y="296.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Masked mean V</text>
<text x="665" y="314.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Optional retained score mass</text>
</g>
<g class="node" id="full"><rect x="149.5" y="191" width="231" height="52" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="265" y="213.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Full-width QKᵀ → Softmax</text>
<text x="265" y="231.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Scale by retained mass if enabled</text>
</g>
<g class="node" id="mix"><rect x="376.5" y="109" width="197" height="52" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="475" y="131.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Weight selected values</text>
<text x="475" y="149.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Add leftover mass × mean V</text>
</g>
<g class="node" id="w"><rect x="66.5" y="35" width="207" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="170" y="57.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Scatter selected weights</text>
</g>
<g class="node" id="out"><rect x="408" y="35" width="134" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="475" y="57.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Output context</text>
</g>
<text x="376" y="506" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge qkv--pick">Q: B×g×r×1×D</text>
<text x="682" y="531" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge qkv--mean">V: B×g×1×S×D</text>
<text x="244" y="538" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge qkv--size">Full K and V</text>
<text x="271" y="429" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge pick--rank">B×g×r×1×S</text>
<text x="275" y="342" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge rank--size">Selected indices</text>
<text x="481" y="357" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge rank--mean">Indices</text>
<text x="266" y="263" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge size--full">g × (k+1) keys per batch</text>
<text x="373" y="285" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge size--mix">Selected V</text>
<text x="598" y="220" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge mean--mix">Mean and mass</text>
<text x="209" y="181" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge full--w">Selected weights</text>
<text x="270" y="163" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge full--mix">B×g×r×1×(k+1)</text>
<text x="481" y="94" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge mix--out">B×h×1×D</text>
</svg>
