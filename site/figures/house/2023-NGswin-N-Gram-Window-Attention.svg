<text class="edge inject--score" x="533" y="155" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">(B·nW)×M×D</text>
<text class="edge score--out" x="493" y="77" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">(B·nW)×M×D</text>
<text class="note" x="695" y="48" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Output: B×(H·W)×D</text>
