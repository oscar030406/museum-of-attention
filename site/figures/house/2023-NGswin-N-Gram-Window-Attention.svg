<text class="box" x="203" y="383" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Pad, unfold n×n windows</text>
<text class="box" x="203" y="402" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Cosine attention → mean</text>
</g>
<g class="node" id="b"><rect x="381" y="341" width="238" height="74" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
