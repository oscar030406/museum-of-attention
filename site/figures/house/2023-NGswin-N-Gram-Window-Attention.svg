<text class="box" x="386" y="489.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">One summary per window</text>
</g>
<g class="node" id="f"><rect x="84" y="341" width="238" height="74" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
