<text class="box" x="500" y="383" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Pad, unfold n×n windows</text>
<text class="box" x="500" y="402" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Cosine attention → mean</text>
</g>
