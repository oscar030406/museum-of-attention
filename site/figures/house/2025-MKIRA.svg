<text x="418.0" y="443.5" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge g--s">Channel-weighted map</text>
<text x="413" y="371" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge s--p">B×Cin×H×W</text>
<text x="414" y="309" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge p--d">B×E×H×W</text>
