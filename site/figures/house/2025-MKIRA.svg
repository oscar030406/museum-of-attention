<text x="408" y="469.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">GAP and GMP → shared MLP</text>
<text x="408" y="487.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Sum → Sigmoid → channel scale</text>
</g>
<g class="node" id="s"><rect x="260" y="376" width="296" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="408" y="400.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Channel mean and max → concat</text>
<text x="408" y="418.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Conv 7×7 → Sigmoid → spatial scale</text>
</g>
<g class="node" id="p"><rect x="316" y="314" width="184" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="408" y="340.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Conv 1×1 + BN + ReLU</text>
</g>
<g class="node" id="d"><rect x="292" y="237" width="232" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="408" y="261.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Multikernel depthwise Conv</text>
<text x="408" y="279.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">BN + ReLU6 per kernel</text>
</g>
<g class="node" id="c"><rect x="288" y="168" width="240" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
