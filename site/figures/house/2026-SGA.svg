<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="proj" d="M 461 528 L 461 498" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="proj" data-to="mean" d="M 385 456 L 347 424" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="proj" data-to="score" d="M 461 456 L 543 404 L 546 331.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="proj" data-to="res" d="M 552 456 L 714 419 L 714 255 L 639 233" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="mean" data-to="score" d="M 317 368 L 365 331.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="score" data-to="res" d="M 474 258.5 L 537 233" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="res" data-to="cat" d="M 537 177 L 537 153" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="cat" data-to="out" d="M 537 111 L 537 82" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<g class="node" id="x"><rect x="363" y="528" width="196" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="461" y="554.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input maps F₁ and F₂</text>
</g>
<g class="node" id="proj"><rect x="344" y="456" width="234" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="461" y="482.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Shared Conv 1×1 → A₁, A₂</text>
</g>
<g class="node" id="mean"><rect x="205" y="368" width="224" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="317" y="392.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Shared reference q</text>
<text x="317" y="410.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">BN + ReLU, average maps, GAP</text>
</g>
<g class="node" id="score"><rect x="295.5" y="258.5" width="291" height="73" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="441" y="282.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Score each map and apply Sigmoid</text>
<text x="441" y="300.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">uᵢ = (Aᵢ − q)²,  σᵢ = Mean(uᵢ)</text>
<text x="441" y="318.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">wᵢ = Sigmoid(uᵢ / (2σᵢ + ε) + 0.5)</text>
</g>
<g class="node" id="res"><rect x="403" y="177" width="268" height="56" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="537" y="201.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Weight and add each residual</text>
<text x="537" y="219.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Aᵢ + β (wᵢ ⊗ Aᵢ)</text>
</g>
<g class="node" id="cat"><rect x="445.5" y="111" width="183" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="537" y="137.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Concat both maps</text>
</g>
<g class="node" id="out"><rect x="391" y="26" width="292" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="537" y="50.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Residual convolution block</text>
<text x="537" y="68.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Conv 3×3, BN, CMConv, ReLU</text>
</g>
<text x="467" y="518" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--proj">Each B×C×H×W</text>
<text x="250" y="446" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge proj--mean">Each B×c×H×W</text>
<text x="550" y="382" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge proj--score">A₁, A₂</text>
<text x="720" y="337" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge proj--res">A₁, A₂</text>
<text x="265" y="355" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge mean--score">B×c×1×1</text>
<text x="531" y="255" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge score--res">Each B×c×H×W</text>
<text x="543" y="95" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge cat--out">B×2c×H×W</text>
</svg>
