<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="p" d="M 474 521 L 474 482" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="p" data-to="q" d="M 474 440 L 474 409" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="q" data-to="a" d="M 466 353 L 333 336.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="a" data-to="m" d="M 333 263.5 L 465 240" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="m" data-to="r" d="M 473 198 L 473 167" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="r" data-to="y" d="M 473 111 L 473 79" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="q" data-to="m" d="M 482 353 L 793 347 L 793 251 L 481 240" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<g class="node" id="x"><rect x="406" y="521" width="136" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="474" y="547.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input features</text>
</g>
<g class="node" id="p"><rect x="354" y="440" width="240" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="474" y="466.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Reshape into channel groups</text>
</g>
<g class="node" id="q"><rect x="290" y="353" width="368" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="474" y="377.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Conv3D 1×1×1 + depthwise 1×3×3</text>
<text x="474" y="395.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Project Q, K and V, flatten group and space</text>
</g>
<g class="node" id="a"><rect x="201" y="263.5" width="264" height="73" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="333" y="287.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Normalize Q and K over tokens</text>
<text x="333" y="305.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Temperature × QᵀK → Top-K mask</text>
<text x="333" y="323.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Softmax across selected tokens</text>
</g>
<g class="node" id="m"><rect x="373" y="198" width="200" height="42" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="473" y="224.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Weight the projected V</text>
</g>
<g class="node" id="r"><rect x="337" y="111" width="272" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="473" y="135.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Restore groups and spatial grid</text>
<text x="473" y="153.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Conv 1×1</text>
</g>
<g class="node" id="y"><rect x="401" y="37" width="144" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="473" y="63.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Output features</text>
</g>
<text x="480" y="507" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--p">B×C×H×W</text>
<text x="480" y="430" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge p--q">B×G×(C/G)×H×W</text>
<text x="469" y="348" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge q--a">B×J×D×N</text>
<text x="431" y="260" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge a--m">B×J×N×N</text>
<text x="479" y="100" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge r--y">B×C×H×W</text>
<text x="658" y="368" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge q--m">V</text>
