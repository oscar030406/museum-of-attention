<text x="309" y="375.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Softmax(QKᵀ / √d) × V</text>
<text x="309" y="393.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Residuals and FFN on both axes</text>
</g>
