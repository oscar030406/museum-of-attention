<text x="544" y="287.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Project alignment and weight by query row</text>
<text x="544" y="305.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Outer products + tiled row summaries</text>
</g>
