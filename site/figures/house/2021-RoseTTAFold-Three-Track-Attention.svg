<text x="480" y="122.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Pair-guided alignment update</text>
<text x="480" y="140.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Symmetrize pair, Linear + Softmax</text>
<text x="480" y="158.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Mix alignment V, residuals + FFN</text>
</g>
