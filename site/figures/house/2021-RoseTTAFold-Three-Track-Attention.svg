<text x="190" y="131.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Distance mask + state Q, K</text>
<text x="190" y="149.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">One distance limit per head</text>
</g>
<g class="node" id="outmsa"><rect x="196.5" y="26" width="331" height="46" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="362" y="45.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Masked Softmax(QKᵀ / √d) × alignment V</text>
<text x="362" y="63.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Residuals + FFN → Updated alignment</text>
</g>
