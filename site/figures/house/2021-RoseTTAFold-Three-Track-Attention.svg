<text x="350" y="455.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Tied attention across positions</text>
<text x="350" y="473.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Weight Q across sequences, sum QKᵀ</text>
<text x="350" y="491.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Softmax over positions, mix V</text>
</g>
