<text x="411" y="553.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Structure states</text>
</g>
<g class="node" id="rbf"><rect x="525" y="527" width="190" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="620" y="553.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Distance RBF features</text>
</g>
<g class="node" id="pair"><rect x="739" y="527" width="160" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="819" y="553.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Pair features</text>
</g>
<g class="node" id="inject"><rect x="170" y="445" width="248" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="294" y="469.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Update first alignment row</text>
<text x="294" y="487.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">LayerNorm + Linear on state</text>
</g>
<g class="node" id="bias"><rect x="553" y="391.5" width="266" height="73" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="686" y="415.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Project pair + distance bias</text>
<text x="686" y="433.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">LayerNorm(pair) + Linear(RBF)</text>
<text x="686" y="451.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">LayerNorm + Linear to heads</text>
</g>
<g class="node" id="qw"><rect x="103.5" y="343.5" width="281" height="73" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="244" y="367.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Sequence weights</text>
<text x="244" y="385.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">First-row Q scores all sequence K</text>
<text x="244" y="403.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Softmax over sequences at each position</text>
</g>
<g class="node" id="row"><rect x="288.5" y="254.5" width="321" height="73" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="449" y="278.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Pair-biased attention across positions</text>
<text x="449" y="296.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Sum weighted QKᵀ across sequences + bias</text>
<text x="449" y="314.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Softmax, mix V, Sigmoid gate + Linear</text>
</g>
<g class="node" id="col"><rect x="297.5" y="168.5" width="303" height="73" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="449" y="192.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Attention across sequences</text>
<text x="449" y="210.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Full or mean-query Softmax, then gate</text>
<text x="449" y="228.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Linear and residuals for both axes</text>
</g>
<g class="node" id="ffn"><rect x="328" y="126" width="242" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="449" y="148.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Residual FFN</text>
</g>
<g class="node" id="pdelta"><rect x="537" y="64" width="244" height="46" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="659" y="83.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Outer-product mean</text>
<text x="659" y="101.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Project both sides, average, Linear</text>
</g>
<g class="node" id="mout"><rect x="173.5" y="25" width="215" height="32" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="281" y="46.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Updated alignment</text>
</g>
<g class="node" id="pout"><rect x="619" y="25" width="220" height="32" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="729" y="46.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Add original pair features</text>
</g>
