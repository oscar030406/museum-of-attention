<text x="459.0" y="253.0" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge row--col">B×N×L×D</text>
<text x="570" y="123" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge ffn--pdelta">B×N×L×D</text>
<text x="345" y="89" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge ffn--mout">B×N×L×D</text>
