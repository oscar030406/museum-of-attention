<g class="node" id="msa"><rect x="127.5" y="527" width="175" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="215" y="553.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Alignment features</text>
</g>
