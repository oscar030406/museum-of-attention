<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="prep" d="M 530 528 L 530 488" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="prep" data-to="qk" d="M 490 432 L 409 386" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="prep" data-to="v" d="M 599 432 L 725 386" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="qk" data-to="logit" d="M 409 344 L 368 298" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="edges" data-to="logit" d="M 193 423 L 259 298" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="logit" data-to="norm" d="M 320 242 L 320 206" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="norm" data-to="reduce" d="M 320 150 L 487 123" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="v" data-to="reduce" d="M 725 344 L 635 123" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="reduce" data-to="out" d="M 535 67 L 535 55" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<g class="node" id="x"><rect x="437.5" y="528" width="185" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="530" y="554.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Session node features</text>
</g>
<g class="node" id="edges"><rect x="43" y="423" width="216" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="151" y="447.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Directed shortcut edges</text>
<text x="151" y="465.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Source and destination IDs</text>
</g>
<g class="node" id="prep"><rect x="403.5" y="432" width="253" height="56" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="530" y="456.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Flatten nodes</text>
<text x="530" y="474.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Optional BatchNorm + Dropout</text>
</g>
<g class="node" id="qk"><rect x="313.5" y="344" width="191" height="42" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="409" y="370.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Project node Q and K</text>
</g>
<g class="node" id="v"><rect x="642.5" y="344" width="165" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="725" y="370.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Project node V</text>
</g>
<g class="node" id="logit"><rect x="207.5" y="242" width="225" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="320" y="266.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Score each directed edge</text>
<text x="320" y="284.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Linear(Sigmoid(Qsrc + Kdst))</text>
</g>
<g class="node" id="norm"><rect x="212" y="150" width="216" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="320" y="174.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Softmax by destination</text>
<text x="320" y="192.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Normalize incoming edge scores</text>
</g>
<g class="node" id="reduce"><rect x="403" y="67" width="264" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="535" y="91.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Sum weighted source values</text>
<text x="535" y="109.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Group by destination</text>
</g>
<g class="node" id="out"><rect x="374.5" y="25" width="321" height="30" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="535" y="45.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Optional activation + restore node axes</text>
</g>
<text x="536" y="513" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--prep">B×T×C</text>
<text x="460" y="409" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge prep--qk">N×C</text>
<text x="673" y="419" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge prep--v">N×C</text>
<text x="399" y="326" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge qk--logit">Q, K: N×d</text>
<text x="232" y="366" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge edges--logit">2×E</text>
<text x="326" y="229" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge logit--norm">E logits</text>
<text x="423" y="147" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge norm--reduce">E weights</text>
<text x="686" y="239" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge v--reduce">V: N×C′</text>
<text x="716" y="46" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="note">Output: B×T×C′ or N×C′</text>
</svg>
