</g>
<g class="node" id="lstm"><rect x="351" y="318" width="152" height="34" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="427" y="340.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Shared LSTMCell</text>
</g>
