</g>
<text x="402" y="515" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--gap">B×C×H×W</text>
<text x="371" y="447" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge gap--lin">B×C</text>
<text x="399" y="378" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge lin--lstm">B×10</text>
<text x="772" y="515" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge p--lstm">B×10 each</text>
<text x="414" y="310" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge lstm--read">B×10</text>
<text x="588" y="312" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge lstm--state">B×10 each</text>
<text x="435" y="226" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge read--route">B decisions</text>
<text x="571" y="241" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge read--prob">B</text>
<text x="230" y="516" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--route">Original block input</text>
</svg>
