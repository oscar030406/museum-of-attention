<path class="flow" data-from="read" data-to="prob" d="M 401 239 L 700 211" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="x" data-to="route" d="M 389 531 L 60 511 L 60 217 L 419 211" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="route" data-to="on" d="M 419 177 L 260 140" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="route" data-to="off" d="M 441 177 L 630 140" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="on" data-to="out" d="M 260 106 L 449 69" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
