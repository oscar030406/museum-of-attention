</g>
<g class="node" id="off"><rect x="521.5" y="106" width="217" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="630" y="128.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Shortcut on skipped rows</text>
</g>
<g class="node" id="out"><rect x="367.5" y="35" width="185" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
