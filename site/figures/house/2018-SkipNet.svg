<text x="390" y="279.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Sigmoid and positive-logit test</text>
</g>
<g class="node" id="state"><rect x="642" y="248" width="176" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
