</g>
<g class="node" id="route"><rect x="316.5" y="177" width="227" height="34" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="430" y="199.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Route samples by decision</text>
</g>
<g class="node" id="prob"><rect x="602" y="177" width="196" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="700" y="199.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Return gate probability</text>
</g>
<g class="node" id="on"><rect x="128.5" y="106" width="263" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
