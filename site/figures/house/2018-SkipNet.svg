<g class="node" id="x"><rect x="316" y="531" width="168" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="400" y="553.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Current block input</text>
</g>
<g class="node" id="p"><rect x="661.5" y="531" width="209" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="766" y="553.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Previous hidden and cell</text>
</g>
