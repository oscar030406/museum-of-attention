<text x="365" y="482.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Global average pooling</text>
</g>
<g class="node" id="lin"><rect x="274" y="389" width="182" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
