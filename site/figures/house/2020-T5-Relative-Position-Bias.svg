<path class="flow" data-from="side" data-to="far" d="M 486 357 L 680 326" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="near" data-to="merge" d="M 270 283 L 464 234" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="far" data-to="merge" d="M 680 274 L 486 234" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="merge" data-to="lut" d="M 475 200 L 475 152" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="lut" data-to="out" d="M 475 118 L 475 69" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<g class="node" id="q"><rect x="164.5" y="522" width="191" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="260" y="544.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Query positions</text>
<text x="260" y="562.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Include cached prefix offset</text>
</g>
<g class="node" id="k"><rect x="637.5" y="531" width="125" height="34" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="700" y="553.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Key positions</text>
</g>
<g class="node" id="rel"><rect x="352.5" y="448" width="245" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="475" y="470.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Key position − query position</text>
</g>
