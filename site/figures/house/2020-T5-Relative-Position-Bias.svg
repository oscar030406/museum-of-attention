<text x="680" y="314.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Cap at the last bucket</text>
</g>
<g class="node" id="merge"><rect x="343.5" y="200" width="263" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
