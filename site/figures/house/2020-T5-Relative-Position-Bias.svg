</g>
<text x="376" y="513" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge q--rel">Q×1</text>
<text x="610" y="507" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge k--rel">1×K</text>
<text x="481" y="434" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge rel--side">Q×K</text>
<text x="385" y="336" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge side--near">Below exact limit</text>
<text x="594" y="354" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge side--far">At or above exact limit</text>
<text x="481" y="181" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge merge--lut">Q×K bucket IDs</text>
<text x="481" y="99" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge lut--out">Q×K×h → 1×h×Q×K</text>
