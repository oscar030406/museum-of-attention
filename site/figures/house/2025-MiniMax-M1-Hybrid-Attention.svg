<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="linear" d="M 432 528 L 363 506" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="x" data-to="gate" d="M 523 528 L 807 406" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="linear" data-to="prefill" d="M 279 450 L 190 420" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="linear" data-to="decode" d="M 447 450 L 497 414.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="prefill" data-to="outl" d="M 190 336 L 384 312" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="decode" data-to="outl" d="M 497 341.5 L 478 312" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="gate" data-to="outl" d="M 774 350 L 574 312" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="outl" data-to="full" d="M 478 256 L 438 237.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="full" data-to="score" d="M 343 164.5 L 334 148.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="full" data-to="out" d="M 537 164.5 L 606 121 L 567 62" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="score" data-to="out" d="M 416 75.5 L 399 62" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<g class="node" id="x"><rect x="392.5" y="528" width="161" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="473" y="554.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input tokens X</text>
</g>
<g class="node" id="linear"><rect x="229.5" y="450" width="267" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="363" y="474.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Linear + activation → Q, K, V</text>
<text x="363" y="492.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">One decay slope per head</text>
</g>
<g class="node" id="prefill"><rect x="48.5" y="336" width="283" height="84" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="190" y="356.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Block prefill without cache</text>
<text x="190" y="374.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Causal decayed QKᵀ within each block</text>
<text x="190" y="392.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Add read from earlier state</text>
<text x="190" y="410.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Decay and update the cache</text>
</g>
<g class="node" id="decode"><rect x="369.5" y="341.5" width="255" height="73" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="497" y="365.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Decode with cached state</text>
<text x="497" y="383.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">S ← exp(−slope) × S + KᵀV</text>
<text x="497" y="401.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Read Q S per token</text>
</g>
<g class="node" id="gate"><rect x="674" y="350" width="200" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="774" y="374.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Linear + Sigmoid</text>
<text x="774" y="392.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Output gate from X</text>
</g>
<g class="node" id="outl"><rect x="335.5" y="256" width="285" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="478" y="280.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Merge heads + RMSNorm</text>
<text x="478" y="298.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Multiply by gate, then Linear</text>
</g>
<g class="node" id="full"><rect x="280.5" y="164.5" width="315" height="73" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="438" y="188.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Project Q, K, V for full attention</text>
<text x="438" y="206.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">RoPE on Q and K, optional cache append</text>
<text x="438" y="224.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Repeat KV across query head groups</text>
</g>
<g class="node" id="score"><rect x="225" y="75.5" width="218" height="73" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="334" y="99.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Full attention weights</text>
<text x="334" y="117.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Scaled QKᵀ + causal mask</text>
<text x="334" y="135.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Softmax over keys</text>
</g>
<g class="node" id="out"><rect x="361" y="26" width="242" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="482" y="49.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Mix V, merge heads, Linear</text>
</g>
<text x="410" y="519" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--linear">B×T×C</text>
<text x="685" y="474" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--gate">B×T×C</text>
<text x="250" y="435" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge linear--prefill">B×h×T×d</text>
<text x="487" y="441" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge linear--decode">B×h×T×d</text>
<text x="497" y="333" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge decode--outl">B×h×T×d</text>
<text x="684" y="330" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge gate--outl">B×T×(hd)</text>
<text x="472" y="251" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge outl--full">B×T×C</text>
<text x="348.5" y="161.5" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge full--score">Q, K</text>
<text x="585" y="153" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge full--out">V: B×h×S×d</text>
<text x="444" y="79" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge score--out">B×h×T×S</text>
<text x="625" y="49" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="note">Output: B×T×C</text>
</svg>
