<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-i" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="q" d="M 412 533 L 208 471.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="x" data-to="kv" d="M 478 533 L 570 471.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="kv" data-to="pack" d="M 570 416.5 L 570 369.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="q" data-to="score" d="M 208 416.5 L 284 266.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-g)"/>
<path class="flow" data-from="pack" data-to="score" d="M 505 314.5 L 444 266.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="pack" data-to="mix" d="M 650 314.5 L 696 286 L 696 184 L 574 150" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="score" data-to="mix" d="M 379 211.5 L 477 150" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<path class="flow" data-from="mix" data-to="out" d="M 519 114 L 519 66" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<g class="node" id="x"><rect x="377" y="533" width="136" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="445" y="556" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Window tokens</text>
</g>
<g class="node" id="q"><rect x="122" y="416.5" width="172" height="55" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="208" y="439.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Linear Q</text>
<text class="box" x="208" y="458.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Keep all N positions</text>
</g>
<g class="node" id="kv"><rect x="472.5" y="416.5" width="195" height="55" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="570" y="439.5" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Linear K and V</text>
<text class="box" x="570" y="458.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Each keeps C/4 channels</text>
</g>
<g class="node" id="pack"><rect x="431" y="314.5" width="278" height="55" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="570" y="337.5" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Permute each 2×2 cell</text>
<text class="box" x="570" y="356.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Pack four positions into channels</text>
</g>
<g class="node" id="score"><rect x="218" y="211.5" width="322" height="55" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="379" y="234.5" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Scaled QKᵀ + aligned relative bias</text>
<text class="box" x="379" y="253.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Optional shift mask → Softmax</text>
</g>
<g class="node" id="mix"><rect x="442" y="114" width="154" height="36" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="519" y="137" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Weight packed V</text>
</g>
<g class="node" id="out"><rect x="420" y="30" width="198" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="519" y="53" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Merge heads → Linear</text>
</g>
<text class="edge x--q" x="320" y="499" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">Bᵥ×N×C</text>
<text class="edge kv--pack" x="576" y="397" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">Bᵥ×N×C/4 per tensor</text>
<text class="edge q--score" x="252" y="347" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">Bᵥ×h×N×d</text>
<text class="edge pack--score" x="487" y="291" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">K: Bᵥ×h×(N/4)×d</text>
<text class="edge pack--mix" x="639" y="165" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">V: Bᵥ×h×(N/4)×d</text>
<text class="edge score--mix" x="438" y="194" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">Bᵥ×h×N×(N/4)</text>
<text class="edge mix--out" x="525" y="93" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">Bᵥ×N×C</text>
<text class="note" x="780" y="237" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Bᵥ = batch × windows</text>
</svg>
