<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="freq" data-to="taper" d="M 180 531 L 180 475" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="pos" data-to="phase" d="M 480 531 L 366 376" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="taper" data-to="phase" d="M 180 423 L 344 376" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="phase" data-to="trig" d="M 355 324 L 355 276" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="trig" data-to="rotate" d="M 355 224 L 469 177" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="qk" data-to="rotate" d="M 780 531 L 780 444 L 780 182 L 491 177" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="rotate" data-to="out" d="M 480 125 L 480 69" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<g class="node" id="freq"><rect x="94.5" y="531" width="171" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="180" y="553.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Inverse frequencies</text>
</g>
<g class="node" id="pos"><rect x="423.5" y="531" width="113" height="34" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="480" y="553.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Position IDs</text>
</g>
<g class="node" id="qk"><rect x="703.5" y="531" width="153" height="34" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="780" y="553.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Queries and keys</text>
</g>
<g class="node" id="taper"><rect x="60" y="423" width="240" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="180" y="445.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Taper the lowest frequencies</text>
<text x="180" y="463.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Multiply by a cosine window</text>
</g>
<g class="node" id="phase"><rect x="256.5" y="324" width="197" height="52" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="355" y="346.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Form angles</text>
<text x="355" y="364.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Position × inverse frequency</text>
</g>
<g class="node" id="trig"><rect x="274.5" y="224" width="161" height="52" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="355" y="246.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Cosine and sine</text>
<text x="355" y="264.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Apply configured scale</text>
</g>
<g class="node" id="rotate"><rect x="379" y="125" width="202" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="480" y="147.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Rotate Q and K</text>
<text x="480" y="165.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">x ⊗ cos + rotate_half(x) ⊗ sin</text>
</g>
<g class="node" id="out"><rect x="407" y="35" width="146" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="57.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Rotated Q and K</text>
</g>
<text x="186" y="508" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge freq--taper">D/2</text>
<text x="429" y="459" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge pos--phase">B×T</text>
<text x="273" y="409" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge taper--phase">D/2</text>
<text x="361" y="305" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge phase--trig">B×T×D</text>
<text x="426" y="210" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge trig--rotate">B×T×D</text>
<text x="786" y="493" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge qk--rotate">B×h×T×D</text>
<text x="486" y="102" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge rotate--out">B×h×T×D</text>
</svg>
