<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-i" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="row" d="M 455 533 L 455 486.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="row" data-to="radd" d="M 455 431.5 L 455 395" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<path class="flow" data-from="radd" data-to="swap" d="M 455 359 L 455 322" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-i)"/>
<path class="flow" data-from="swap" data-to="col" d="M 455 286 L 455 251" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-i)"/>
<path class="flow" data-from="col" data-to="cadd" d="M 455 177 L 455 146" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<path class="flow" data-from="cadd" data-to="out" d="M 455 110 L 455 64" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-i)"/>
<g class="node" id="x"><rect x="374" y="533" width="162" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="455" y="556" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Table token grid</text>
</g>
<g class="node" id="row"><rect x="266" y="431.5" width="378" height="55" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="455" y="454.5" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Attend across feature groups in each row</text>
<text class="box" x="455" y="473.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">QKV → scaled scores → Softmax → mix V</text>
</g>
<g class="node" id="radd"><rect x="334" y="359" width="242" height="36" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text class="box" x="455" y="382" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Add row input → LayerNorm</text>
</g>
<g class="node" id="swap"><rect x="311" y="286" width="288" height="36" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text class="box" x="455" y="309" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Swap rows and feature groups</text>
</g>
<g class="node" id="col"><rect x="257.5" y="177" width="395" height="74" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="455" y="200" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Attend across rows in each feature group</text>
<text class="box" x="455" y="219" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Q from all rows, K and V from training rows</text>
<text class="box" x="455" y="238" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Scaled scores → Softmax → mix V</text>
</g>
<g class="node" id="cadd"><rect x="285" y="110" width="340" height="36" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text class="box" x="455" y="133" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Add input, restore axes → LayerNorm</text>
</g>
<g class="node" id="out"><rect x="329.5" y="28" width="251" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="455" y="51" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Residual MLP → LayerNorm</text>
</g>
<text class="edge x--row" x="461" y="513" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">B×R×F×C</text>
<text class="edge row--radd" x="461" y="417" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">B×R×F×C</text>
<text class="edge radd--swap" x="461" y="344" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">B×R×F×C</text>
<text class="edge swap--col" x="461" y="273" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">B×F×R×C</text>
<text class="edge col--cadd" x="461" y="165" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">B×F×R×C</text>
<text class="edge cadd--out" x="461" y="91" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">B×R×F×C</text>
<text class="note" x="764" y="206" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">K and V may be cached</text>
</svg>
