<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="nodes" data-to="msg" d="M 254 526 L 362 499.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="adj" data-to="msg" d="M 608 526 L 498 499.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="msg" data-to="seq" d="M 429 426.5 L 429 405" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="seq" data-to="attn" d="M 374 349 L 358 312.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="mask" data-to="attn" d="M 149 349 L 229 312.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="seq" data-to="local" d="M 494 349 L 671 197" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="attn" data-to="global" d="M 314 239.5 L 314 197" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="global" data-to="blend" d="M 314 155 L 426 130" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="local" data-to="blend" d="M 671 155 L 536 130" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="blend" data-to="out" d="M 481 74 L 481 60" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<g class="node" id="nodes"><rect x="167" y="526" width="174" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="254" y="552.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Item node features</text>
</g>
<g class="node" id="adj"><rect x="512" y="526" width="192" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="608" y="552.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">In/out adjacency A</text>
</g>
<g class="node" id="msg"><rect x="295.5" y="426.5" width="267" height="73" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="429" y="450.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Gated graph updates</text>
<text x="429" y="468.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Linear → in/out sums → Concat</text>
<text x="429" y="486.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Reset and update gates per step</text>
</g>
<g class="node" id="seq"><rect x="304.5" y="349" width="249" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="429" y="373.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Gather nodes in session order</text>
<text x="429" y="391.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Index by item aliases</text>
</g>
<g class="node" id="mask"><rect x="57" y="349" width="184" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="149" y="373.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Causal padding mask</text>
<text x="149" y="391.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">From item IDs</text>
</g>
<g class="node" id="attn"><rect x="180.5" y="239.5" width="267" height="73" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="314" y="263.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Causal self-attention</text>
<text x="314" y="281.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Masked Softmax(QKᵀ / √d) × V</text>
<text x="314" y="299.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Merge heads, residuals + FFN</text>
</g>
<g class="node" id="local"><rect x="583.5" y="155" width="175" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="671" y="181.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Last valid graph state</text>
</g>
<g class="node" id="global"><rect x="215.5" y="155" width="197" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="314" y="181.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Last valid attended state</text>
</g>
<g class="node" id="blend"><rect x="360" y="74" width="242" height="56" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="481" y="98.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Blend last states</text>
<text x="481" y="116.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">w × attended + (1 − w) × graph</text>
</g>
<g class="node" id="out"><rect x="402.5" y="26" width="157" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="481" y="48.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Session vector</text>
</g>
<text x="328" y="521" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge nodes--msg">B×N×D</text>
<text x="570" y="514" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge adj--msg">B×N×2N</text>
<text x="435" y="421" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge msg--seq">B×N×D</text>
<text x="375" y="335" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge seq--attn">B×T×D</text>
<text x="201" y="339" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge mask--attn">B×1×T×T</text>
<text x="591" y="277" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge seq--local">B×T×D</text>
<text x="320" y="223" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge attn--global">B×T×D</text>
<text x="387" y="152" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge global--blend">B×D</text>
<text x="616" y="141" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge local--blend">B×D</text>
<text x="491.0" y="72.0" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge blend--out">B×D</text>
</svg>
