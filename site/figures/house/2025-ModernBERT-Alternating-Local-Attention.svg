<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="mode" data-to="pos" d="M 276 519 L 318 474" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="mode" data-to="mask" d="M 142 519 L 145 372" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="x" data-to="proj" d="M 620 526 L 620 474" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="proj" data-to="rope" d="M 570 418 L 503 365" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="proj" data-to="mix" d="M 685 418 L 738 355 L 738 201 L 661 168" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="pos" data-to="rope" d="M 318 418 L 411 365" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="rope" data-to="score" d="M 458 323 L 453 274.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="mask" data-to="score" d="M 145 316 L 311 274.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="score" data-to="mix" d="M 405 201.5 L 525 168" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="mix" data-to="out" d="M 590 126 L 590 76" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<g class="node" id="x"><rect x="541" y="526" width="158" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="620" y="552.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input tokens</text>
</g>
<g class="node" id="mode"><rect x="81.5" y="519" width="241" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="202" y="543.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Select type by layer index</text>
<text x="202" y="561.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Global or sliding window</text>
</g>
<g class="node" id="pos"><rect x="202.5" y="418" width="231" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="318" y="442.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Position IDs → cos and sin</text>
<text x="318" y="460.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Use RoPE settings for layer type</text>
</g>
<g class="node" id="mask"><rect x="38.5" y="316" width="213" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="145" y="340.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Bidirectional mask</text>
<text x="145" y="358.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Global or window, plus padding</text>
</g>
<g class="node" id="proj"><rect x="524" y="418" width="192" height="56" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="620" y="442.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Linear → Q, K, V</text>
<text x="620" y="460.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Split into heads</text>
</g>
<g class="node" id="rope"><rect x="368" y="323" width="180" height="42" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="458" y="349.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Rotate Q and K</text>
</g>
<g class="node" id="score"><rect x="276" y="201.5" width="258" height="73" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="405" y="225.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Masked attention weights</text>
<text x="405" y="243.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Softmax(QKᵀ / √d + mask)</text>
<text x="405" y="261.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Dropout</text>
</g>
<g class="node" id="mix"><rect x="491.5" y="126" width="197" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="590" y="152.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Multiply weights by V</text>
</g>
<g class="node" id="out"><rect x="458.5" y="34" width="263" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="590" y="60.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Merge heads + Linear + Dropout</text>
</g>
<text x="626" y="505" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--proj">B×T×C</text>
<text x="550" y="393" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge proj--rope">Q, K: B×h×T×d</text>
<text x="723" y="390" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge proj--mix">V: B×h×T×d</text>
<text x="375" y="400" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge pos--rope">B×T×d</text>
<text x="463" y="305" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge rope--score">B×h×T×d</text>
<text x="233" y="310" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge mask--score">B×1×T×T</text>
<text x="477" y="197" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge score--mix">B×h×T×T</text>
<text x="596" y="106" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge mix--out">B×h×T×d</text>
<text x="744" y="60" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="note">Output: B×T×C</text>
</svg>
