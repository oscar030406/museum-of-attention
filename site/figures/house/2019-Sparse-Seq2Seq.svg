<g class="node" id="x"><rect x="377" y="531" width="196" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="475" y="553.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Input alignment scores</text>
</g>
