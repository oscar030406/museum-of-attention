<text x="175" y="429.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Subtract row max</text>
</g>
<g class="node" id="m"><rect x="358.5" y="407" width="233" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="475" y="429.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Subtract row max and halve</text>
</g>
<g class="node" id="r"><rect x="657.5" y="407" width="225" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="770" y="429.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Scale by α − 1 and bound τ</text>
</g>
<g class="node" id="t1"><rect x="63.5" y="274" width="223" height="52" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="175" y="296.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Sort a copy and compute τ</text>
<text x="175" y="314.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Find positive support</text>
</g>
<g class="node" id="t2"><rect x="363.5" y="274" width="223" height="52" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="475" y="296.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Sort a copy and compute τ</text>
<text x="475" y="314.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Use prefix mean and variance</text>
</g>
<g class="node" id="t3"><rect x="660.5" y="274" width="219" height="52" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="770" y="296.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Bisect threshold τ</text>
<text x="770" y="314.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Compare probability sum to one</text>
</g>
<g class="node" id="p1"><rect x="104.5" y="159" width="141" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="175" y="181.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">ReLU(score − τ)</text>
</g>
<g class="node" id="p2"><rect x="402" y="159" width="146" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="475" y="181.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">ReLU(score − τ)²</text>
</g>
<g class="node" id="p3"><rect x="663.5" y="150" width="213" height="52" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="770" y="172.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">ReLU(score − τ)^(1/(α−1))</text>
<text x="770" y="190.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Optional final normalization</text>
</g>
<g class="node" id="out"><rect x="352" y="35" width="246" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="475" y="57.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Sparse attention probabilities</text>
</g>
<text x="332" y="486" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge x--l">B×Q×K</text>
