<text x="181" y="372" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge l--t1">α = 2</text>
<text x="481" y="372" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge m--t2">α = 1.5</text>
<text x="776" y="372" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge r--t3">General α</text>
<text x="181" y="239" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge t1--p1">Scores and τ</text>
<text x="481" y="239" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge t2--p2">Scores and τ</text>
<text x="776" y="243" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge t3--p3">Scores and τ</text>
<text x="332" y="124" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge p1--out">B×Q×K</text>
</svg>
