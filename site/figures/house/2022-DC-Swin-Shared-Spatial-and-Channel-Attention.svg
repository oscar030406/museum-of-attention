<g class="node" id="ins"><rect x="183.5" y="523" width="183" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="275" y="549.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Spatial input</text>
</g>
<g class="node" id="projs"><rect x="135.5" y="419" width="279" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="275" y="443.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Conv 1×1 → Q, K, V</text>
<text x="275" y="461.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Flatten positions, L2-normalize Q and K</text>
</g>
<g class="node" id="dens"><rect x="84" y="297" width="188" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="178" y="321.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Spatial normalizer</text>
<text x="178" y="339.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">r = 1 / (N + Q(sum K + ε))</text>
</g>
<g class="node" id="nums"><rect x="291" y="297" width="192" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="387" y="321.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Spatial contraction</text>
<text x="387" y="339.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">S = Σpos V + (Q(KVᵀ))ᵀ</text>
</g>
<g class="node" id="muls"><rect x="182.5" y="171" width="185" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="275" y="195.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Normalize per position</text>
<text x="275" y="213.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">r × S, then reshape</text>
</g>
<g class="node" id="outs"><rect x="169.5" y="44" width="211" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="275" y="68.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Residual output</text>
<text x="275" y="86.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">X + γ × attended features</text>
</g>
<g class="node" id="inc"><rect x="594.5" y="523" width="183" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="686" y="549.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Channel input</text>
</g>
<g class="node" id="projc"><rect x="546.5" y="419" width="279" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="686" y="443.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Flatten X → Q, K, V</text>
<text x="686" y="461.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">L2-normalize Q and K</text>
</g>
<g class="node" id="denc"><rect x="495" y="297" width="188" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="589" y="321.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Channel normalizer</text>
<text x="589" y="339.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">r = 1 / (N + Kᵀ(sum Q + ε))</text>
</g>
<g class="node" id="numc"><rect x="693" y="297" width="210" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="798" y="321.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Contract over channels</text>
<text x="798" y="339.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">S = Σch V + (VKᵀ)Q</text>
</g>
<g class="node" id="mulc"><rect x="593.5" y="171" width="185" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="686" y="195.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Normalize per channel</text>
<text x="686" y="213.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">r × S, then reshape</text>
</g>
<g class="node" id="outc"><rect x="580.5" y="44" width="211" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="686" y="68.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Residual output</text>
<text x="686" y="86.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">X + γ × attended features</text>
</g>
