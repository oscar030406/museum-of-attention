<g class="node" id="x"><rect x="402" y="521" width="136" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="470" y="547.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input features</text>
</g>
<g class="node" id="p"><rect x="342" y="445" width="256" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="470" y="469.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Conv 1×1 + depthwise Conv 3×3</text>
<text x="470" y="487.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Split Q, K and V</text>
</g>
<g class="node" id="f"><rect x="314" y="376" width="312" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="470" y="400.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Pad width → real FFT 2D</text>
<text x="470" y="418.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Concat real and imaginary, sort bins</text>
</g>
<g class="node" id="g"><rect x="322" y="307" width="296" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="470" y="331.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Pad and pack two subbands</text>
<text x="470" y="349.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Fold band index into head channels</text>
</g>
<g class="node" id="s"><rect x="167" y="237" width="336" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="335" y="261.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Normalize Q and K over frequency</text>
<text x="335" y="279.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Temperature × QKᵀ → exp / (sum exp + 1)</text>
</g>
<g class="node" id="m"><rect x="395" y="175" width="208" height="42" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="499" y="201.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Weight Fourier-domain V</text>
</g>
<g class="node" id="r"><rect x="343" y="99" width="312" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="499" y="123.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Unpack, unpad and scatter</text>
<text x="499" y="141.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Restore complex pairs and apply IFFT</text>
</g>
<g class="node" id="y"><rect x="383" y="37" width="232" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="499" y="63.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Conv 1×1 → output features</text>
</g>
<text x="476" y="516" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--p">B×C×H×W</text>
<text x="480.0" y="374.5" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge f--g">B×2C×Nf</text>
<text x="245" y="307" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge g--s">B×J×4D×L</text>
<text x="466" y="234" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge s--m">B×J×4D×4D</text>
<text x="505" y="94" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge r--y">B×C×H×W</text>
<text x="646" y="325" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge g--m">Fourier V</text>
</svg>
