<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="qk" d="M 469 531 L 330 491" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="x" data-to="v" d="M 491 531 L 690 482" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="pos" data-to="rot" d="M 125 531 L 105 417 L 319 400" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="qk" data-to="rot" d="M 330 439 L 341 400" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="rot" data-to="sc" d="M 330 366 L 330 317" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="sc" data-to="sm" d="M 330 283 L 330 243" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="sm" data-to="mix" d="M 341 191 L 484 152" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="sm" data-to="w" d="M 319 191 L 155 168 L 190 69" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="v" data-to="mix" d="M 690 448 L 690 428 L 690 160 L 506 152" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="mix" data-to="out" d="M 495 118 L 495 69" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<g class="node" id="x"><rect x="422" y="531" width="116" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="553.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input tokens</text>
</g>
<g class="node" id="pos"><rect x="60.5" y="531" width="129" height="34" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="125" y="553.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Rotary factors</text>
</g>
<g class="node" id="qk"><rect x="208.5" y="439" width="243" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="330" y="461.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Project Q and K → RMSNorm</text>
<text x="330" y="479.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Then split into heads</text>
</g>
<g class="node" id="v"><rect x="591" y="448" width="198" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="690" y="470.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Project V → split heads</text>
</g>
<g class="node" id="rot"><rect x="231" y="366" width="198" height="34" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="330" y="388.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Apply RoPE to Q and K</text>
</g>
<g class="node" id="sc"><rect x="204.5" y="283" width="251" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="330" y="305.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Repeat K heads → scaled QKᵀ</text>
</g>
<g class="node" id="sm"><rect x="220.5" y="191" width="219" height="52" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="330" y="213.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Optional mask → Softmax</text>
<text x="330" y="231.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Dropout in training</text>
</g>
<g class="node" id="mix"><rect x="380" y="118" width="230" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="495" y="140.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Repeat V heads → weight V</text>
</g>
<g class="node" id="out"><rect x="399.5" y="35" width="191" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="495" y="57.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Merge heads → Linear</text>
</g>
<g class="node" id="w"><rect x="121.5" y="35" width="137" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="190" y="57.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Output weights</text>
</g>
<text x="405" y="510" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--qk">B×T×C</text>
<text x="123" y="482" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge pos--rot">B×T×D each</text>
<text x="344" y="425" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge qk--rot">Q: B×h×T×D</text>
<text x="336" y="347" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge rot--sc">K: B×g×T×D</text>
<text x="336" y="268" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge sc--sm">B×h×T×S</text>
<text x="429" y="183" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge sm--mix">B×h×T×S</text>
<text x="696" y="443" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge v--mix">B×g×S×D</text>
<text x="501" y="99" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge mix--out">B×T×h×D</text>
</svg>
