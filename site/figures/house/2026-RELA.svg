<text x="479" y="186" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge r--a">B×C×H×W</text>
<text x="831" y="355" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge l--a">B×C×H×W</text>
<text x="531" y="94" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge a--y">B×C×H×W</text>
</svg>
