<text x="383" y="379.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">ELU + 1 on Q and K</text>
<text x="383" y="397.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Flatten and split heads</text>
</g>
