<text x="525" y="131.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Add local V ⊕</text>
<text x="525" y="149.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Conv 1×1</text>
</g>
<g class="node" id="y"><rect x="455" y="35" width="140" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
