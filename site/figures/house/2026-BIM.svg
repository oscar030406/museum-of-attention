<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="f1" d="M 438 530 L 232 488" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="x" data-to="f2" d="M 522 530 L 728 488" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="f1" data-to="stack" d="M 294 446 L 380 417" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="f2" data-to="stack" d="M 666 446 L 580 417" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="f1" data-to="w" d="M 167 446 L 167 296 L 372 257" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="f2" data-to="w" d="M 793 446 L 793 296 L 589 257" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="stack" data-to="score" d="M 480 375 L 480 347" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="score" data-to="w" d="M 480 291 L 480 257" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="w" data-to="p" d="M 480 201 L 480 162" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="p" data-to="out" d="M 480 106 L 480 69" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<g class="node" id="x"><rect x="404.5" y="530" width="151" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="556.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input features</text>
</g>
<g class="node" id="f1"><rect x="122.5" y="446" width="219" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="232" y="472.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Conv 1×1 → DW Conv 3×3</text>
</g>
<g class="node" id="f2"><rect x="618.5" y="446" width="219" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="728" y="472.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Conv 1×1 → DW Conv 9×9</text>
</g>
<g class="node" id="stack"><rect x="340.5" y="375" width="279" height="42" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="480" y="401.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Concat channels, flatten, L2 norm</text>
</g>
<g class="node" id="score"><rect x="353.5" y="291" width="253" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="480" y="315.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Channel similarity → MLP</text>
<text x="480" y="333.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">X̂X̂ᵀ → Linear, Leaky ReLU, Linear</text>
</g>
<g class="node" id="w"><rect x="329" y="201" width="302" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="480" y="225.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Split scores and weight both scales</text>
<text x="480" y="243.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">U = x₁ ⊗ a₁,   V = x₂ ⊗ a₂</text>
</g>
<g class="node" id="p"><rect x="300.5" y="106" width="359" height="56" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="480" y="130.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Three feature products</text>
<text x="480" y="148.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">U ⊗ V → DW Conv 3×3 ⊗ V → DW Conv 3×3 ⊗ U</text>
</g>
<g class="node" id="out"><rect x="372" y="27" width="216" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="53.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Conv 1×1 → Output</text>
</g>
<text x="260" y="520" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--f1">B×C×H×W</text>
<text x="173" y="346" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge f1--w">x₁: B×C×H×W</text>
<text x="799" y="346" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge f2--w">x₂: B×C×H×W</text>
<text x="486" y="366" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge stack--score">B×2C×HW</text>
<text x="486" y="279" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge score--w">B×2C×1×1</text>
<text x="486" y="187" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge w--p">U, V: B×C×H×W</text>
<text x="486" y="93" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge p--out">B×C×H×W</text>
</svg>
