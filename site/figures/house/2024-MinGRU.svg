<text x="300" y="346.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Positive candidate h̃</text>
<text x="300" y="364.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">g(x) or log g(x)</text>
</g>
<g class="node" id="z"><rect x="499.5" y="324" width="201" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
