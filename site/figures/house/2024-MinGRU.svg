<text x="600" y="364.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Log forms for sequence scan</text>
</g>
<g class="node" id="blend"><rect x="361.5" y="215" width="237" height="70" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
