<text x="465" y="454.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Linear → split hidden and gate</text>
</g>
<g class="node" id="prev"><rect x="706.5" y="432" width="197" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
