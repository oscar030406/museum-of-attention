<text x="480" y="255.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">h = (1 − z) ⊗ h(prev) + z ⊗ h̃</text>
<text x="480" y="273.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Log-space scan for multiple tokens</text>
</g>
