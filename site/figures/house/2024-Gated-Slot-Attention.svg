<text x="470" y="556.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input tokens</text>
</g>
<g class="node" id="q"><rect x="36" y="424" width="156" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="114" y="448.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Project Q</text>
<text x="114" y="466.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Optional feature map</text>
</g>
<g class="node" id="k"><rect x="222.5" y="424" width="161" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="303" y="448.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Project K</text>
<text x="303" y="466.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Optional feature map</text>
</g>
<g class="node" id="g"><rect x="413" y="424" width="180" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="503" y="448.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Project slot gate</text>
<text x="503" y="466.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">f = exp(LogSigmoid / n)</text>
</g>
<g class="node" id="v"><rect x="717" y="431" width="176" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="805" y="457.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Project V + SiLU</text>
</g>
<g class="node" id="hk"><rect x="243" y="316" width="218" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="352" y="340.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Update key slots</text>
<text x="352" y="358.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Kₛ = f Kₛ(prev) + k ⊗ (1 − f)</text>
</g>
<g class="node" id="hv"><rect x="559" y="316" width="224" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="671" y="340.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Update value slots</text>
<text x="671" y="358.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Vₛ = f Vₛ(prev) + (1 − f) ⊗ v</text>
</g>
<g class="node" id="score"><rect x="131" y="223" width="222" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="242" y="247.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Score and normalize slots</text>
<text x="242" y="265.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Softmax(qᵀKₛ / √K)</text>
</g>
<g class="node" id="read"><rect x="355.5" y="139" width="187" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="449" y="163.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Mix slot values</text>
<text x="449" y="181.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Weighted sum over M</text>
</g>
<g class="node" id="proj"><rect x="293.5" y="79" width="311" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="449" y="101.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Merge heads, SiLU, RMSNorm, Linear</text>
</g>
<g class="node" id="out"><rect x="382.5" y="26" width="133" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="449" y="48.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Output tokens</text>
</g>
