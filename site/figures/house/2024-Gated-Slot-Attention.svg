<text x="123" y="319" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge q--score">B×T×H×K</text>
<text x="236" y="400" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge k--hk">B×T×H×K</text>
<text x="434" y="394" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge g--hk">f, 1 − f</text>
<text x="584" y="417" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge g--hv">B×T×H×M</text>
<text x="790" y="410" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge v--hv">B×T×H×V</text>
<text x="347" y="303" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge hk--score">B×H×K×M</text>
<text x="269" y="197" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge score--read">B×T×H×M</text>
<text x="624" y="271" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge hv--read">B×H×M×V</text>
