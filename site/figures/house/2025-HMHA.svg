<text x="453" y="395.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Temperature × QKᵀ → Softmax</text>
</g>
<g class="node" id="t"><rect x="40" y="353" width="232" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="156" y="377.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Normalize and detach Q, K</text>
<text x="156" y="395.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Add and concatenate groups</text>
</g>
