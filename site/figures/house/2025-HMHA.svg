<text x="378" y="448.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Conv 1×1 + depthwise → Q, K, V</text>
<text x="378" y="466.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Flatten and rank by Q correlation</text>
<text x="378" y="484.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Reorder into groups 1:2:2:3</text>
</g>
