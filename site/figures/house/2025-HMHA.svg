<text x="434" y="215.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Apply weights to group V</text>
<text x="434" y="233.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Concat channel groups</text>
</g>
<g class="node" id="c"><rect x="624" y="182.5" width="296" height="73" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="772" y="206.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Update layer cache</text>
<text x="772" y="224.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Pool groups, resize and accumulate</text>
<text x="772" y="242.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Blend with previous cache if given</text>
</g>
<g class="node" id="r"><rect x="276" y="102.5" width="232" height="73" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="392" y="126.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Add current Q + K cache</text>
<text x="392" y="144.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">GELU gate and Conv1D pair</text>
<text x="392" y="162.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Add back weighted features</text>
</g>
<g class="node" id="y"><rect x="288" y="37" width="208" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="392" y="63.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Restore grid + Conv 1×1</text>
</g>
<g class="node" id="z"><rect x="688" y="37" width="168" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="772" y="63.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Output layer cache</text>
</g>
