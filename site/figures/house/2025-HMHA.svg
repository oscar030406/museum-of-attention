<text x="465" y="287.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Optional cache modulation</text>
<text x="465" y="305.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Align → predict scale and shift</text>
<text x="465" y="323.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">GELU gate, then add to weights</text>
</g>
