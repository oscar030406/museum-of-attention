<text x="280" y="397.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Concat → Conv 1×1 → split</text>
</g>
<g class="node" id="axis"><rect x="182" y="274" width="256" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="310" y="296.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Sigmoid axis gates → reweight</text>
<text x="310" y="314.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">GroupNorm gives X₁</text>
</g>
<g class="node" id="conv"><rect x="577.5" y="283" width="165" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="660" y="305.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Conv 3×3 gives X₂</text>
</g>
<g class="node" id="sc"><rect x="308.5" y="191" width="323" height="52" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="470" y="213.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Cross-branch spatial scores</text>
<text x="470" y="231.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Softmax(GAP(X₁)) X₂ + Softmax(GAP(X₂)) X₁</text>
</g>
<g class="node" id="w"><rect x="363.5" y="118" width="213" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="470" y="140.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Reshape map → Sigmoid</text>
</g>
<g class="node" id="out"><rect x="315.5" y="35" width="339" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="485" y="57.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Weight grouped input → restore channels</text>
</g>
<text x="486" y="512" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--grp">B×C×H×W</text>
<text x="395" y="427" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge grp--pool">(BG)×c×H×W</text>
<text x="225" y="458" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge grp--axis">Grouped features</text>
<text x="313" y="351" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge pool--axis">Height and width factors</text>
<text x="393" y="271" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge axis--sc">X₁: (BG)×c×H×W</text>
<text x="585" y="262" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge conv--sc">X₂: (BG)×c×H×W</text>
<text x="476" y="177" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge sc--w">(BG)×1×H×W</text>
<text x="478" y="98" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge w--out">(BG)×1×H×W</text>
<text x="701" y="456" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge grp--out">Grouped feature bypass</text>
</svg>
