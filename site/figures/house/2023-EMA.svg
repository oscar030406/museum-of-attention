<path class="flow" data-from="w" data-to="out" d="M 470 118 L 474 69" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="grp" data-to="out" d="M 513 448 L 877 430 L 877 102 L 496 69" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<g class="node" id="x"><rect x="417" y="531" width="126" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="553.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input features</text>
</g>
<g class="node" id="grp"><rect x="342" y="448" width="276" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="470.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Fold G channel groups into batch</text>
</g>
<g class="node" id="pool"><rect x="183" y="357" width="194" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
