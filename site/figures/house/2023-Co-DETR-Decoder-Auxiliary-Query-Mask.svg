<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-i" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="assign" data-to="sel" d="M 275 527 L 275 480.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-g)"/>
<path class="flow" data-from="pyr" data-to="flat" d="M 701 527 L 701 480.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="sel" data-to="q" d="M 275 425.5 L 400 386.5" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-i)"/>
<path class="flow" data-from="flat" data-to="q" d="M 701 425.5 L 561 386.5" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-i)"/>
<path class="flow" data-from="q" data-to="zero" d="M 394 331.5 L 234 283" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-g)"/>
<path class="flow" data-from="q" data-to="neg" d="M 566 331.5 L 713 283" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-g)"/>
<path class="flow" data-from="zero" data-to="mask" d="M 173 209 L 173 144" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<path class="flow" data-from="zero" data-to="out" d="M 311 209 L 555 143.5" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<path class="flow" data-from="neg" data-to="out" d="M 713 209 L 707 143.5" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-i)"/>
<g class="node" id="assign"><rect x="110" y="527" width="330" height="36" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="275" y="550" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Assigned boxes, labels and targets</text>
</g>
<g class="node" id="pyr"><rect x="570" y="527" width="262" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="701" y="550" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Pyramid or region features</text>
</g>
<g class="node" id="sel"><rect x="141.5" y="425.5" width="267" height="55" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text class="box" x="275" y="448.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Select and cap positive indices</text>
<text class="box" x="275" y="467.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Choose shared batch length M ≥ 9</text>
</g>
<g class="node" id="flat"><rect x="538" y="425.5" width="326" height="55" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text class="box" x="701" y="448.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Align features to assignments</text>
<text class="box" x="701" y="467.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Flatten and repeat, or use region features</text>
</g>
<g class="node" id="q"><rect x="307.5" y="331.5" width="345" height="55" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="480" y="354.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Gather positive queries and targets</text>
<text class="box" x="480" y="373.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Normalize boxes, convert to center and size</text>
</g>
<g class="node" id="zero"><rect x="93.5" y="209" width="281" height="74" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="234" y="232" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Zero-pad to M</text>
<text class="box" x="234" y="251" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Block all padded rows and columns</text>
<text class="box" x="234" y="270" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Set loss weights on positives</text>
</g>
<g class="node" id="neg"><rect x="560.5" y="209" width="305" height="74" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text class="box" x="713" y="232" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Or fill from sampled background</text>
<text class="box" x="713" y="251" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Keep all label weights at one</text>
<text class="box" x="713" y="270" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Box loss only for positives</text>
</g>
<g class="node" id="mask"><rect x="85.5" y="108" width="297" height="36" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="234" y="131" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Broadcast mask over eight heads</text>
</g>
<g class="node" id="out"><rect x="486" y="88.5" width="330" height="55" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="651" y="111.5" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Stack auxiliary queries and targets</text>
<text class="box" x="651" y="130.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Boxes, labels, features and loss weights</text>
</g>
<text class="edge assign--sel" x="281" y="507" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">Per image</text>
<text class="edge sel--q" x="343" y="417" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">Positive indices</text>
<text class="edge flat--q" x="635" y="405" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">Nᵢ×C</text>
<text class="edge q--zero" x="327" y="308" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">Positive subset</text>
<text class="edge zero--mask" x="179" y="180" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">B×M×M</text>
<text class="edge zero--out" x="431" y="189" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">Zero-padded queries</text>
<text class="edge neg--out" x="717" y="180" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">No mask in this path</text>
<text class="note" x="234" y="75" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Blocked pairs: (B·8)×M×M</text>
<text class="note" x="651" y="65" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Features: B×M×C</text>
</svg>
