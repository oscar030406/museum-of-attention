<text x="287" y="445.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Reflect pad X and X²</text>
<text x="287" y="463.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Window means E[X] and E[X²]</text>
</g>
