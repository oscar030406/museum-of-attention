</g>
<g class="node" id="s"><rect x="172.5" y="324" width="229" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="287" y="346.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Window standard deviation</text>
<text x="287" y="364.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">√max(E[X²] − E[X]², ε)</text>
</g>
<g class="node" id="g"><rect x="197" y="233" width="180" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="287" y="255.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Conv 1×1 → Sigmoid</text>
</g>
<g class="node" id="m"><rect x="375.5" y="134" width="229" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="490" y="156.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Scale convolved features ⊗</text>
</g>
<g class="node" id="y"><rect x="399.5" y="35" width="181" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
