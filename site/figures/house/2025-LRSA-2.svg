<path class="flow" data-from="r" data-to="f" d="M 470 237 L 470 217" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="f" data-to="m" d="M 470 175 L 470 155" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
