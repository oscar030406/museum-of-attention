<g class="node" id="x"><rect x="399" y="521" width="136" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="467" y="547.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input features</text>
</g>
<g class="node" id="p"><rect x="333" y="445" width="264" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="465" y="469.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Crop overlapping patches</text>
<text x="465" y="487.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Flatten each patch into tokens</text>
</g>
<g class="node" id="q"><rect x="349" y="376" width="232" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="465" y="400.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">LayerNorm → Linear Q, K, V</text>
<text x="465" y="418.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Split attention heads</text>
</g>
<g class="node" id="a"><rect x="196" y="307" width="248" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="320" y="331.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Scaled dot product → Softmax</text>
<text x="320" y="349.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Apply weights to V</text>
</g>
<g class="node" id="r"><rect x="362" y="237" width="216" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="470" y="261.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Merge heads and project</text>
<text x="470" y="279.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Add patch token residual</text>
</g>
<g class="node" id="f"><rect x="326" y="175" width="288" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="470" y="201.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Fold patches and average overlaps</text>
</g>
<g class="node" id="m"><rect x="314" y="99" width="312" height="56" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="470" y="123.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">LayerNorm + residual ConvFFN</text>
<text x="470" y="141.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Linear, GELU, depthwise Conv, Linear</text>
</g>
<g class="node" id="y"><rect x="398" y="37" width="144" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="470" y="63.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Output features</text>
</g>
<text x="473" y="516" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--p">B×C×H×W</text>
<text x="451" y="366" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge q--a">Q, K, V</text>
<text x="476" y="232" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge r--f">(B·M)×P²×C</text>
<text x="476" y="94" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge m--y">B×C×H×W</text>
<text x="658" y="456" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge p--r">Patch tokens</text>
</svg>
