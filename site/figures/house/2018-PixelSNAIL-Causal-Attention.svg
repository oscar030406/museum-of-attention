<text x="175" y="454.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Keep only earlier raster positions</text>
<text x="175" y="472.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Min pool mask for pooled keys</text>
</g>
