<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="p" d="M 480 531 L 480 494" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="p" data-to="pad" d="M 469 460 L 360 432" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="pad" data-to="sc" d="M 360 380 L 360 366" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="sc" data-to="mlp" d="M 360 304 L 360 288" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="mlp" data-to="fold" d="M 360 242 L 360 220" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="fold" data-to="rep" d="M 360 168 L 360 140" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="rep" data-to="out" d="M 360 106 L 469 69" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="p" data-to="out" d="M 491 460 L 863 451 L 863 120 L 491 69" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<g class="node" id="x"><rect x="402.5" y="531" width="155" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="553.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input features</text>
</g>
<g class="node" id="p"><rect x="368" y="460" width="224" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="480" y="482.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Conv 1×1 → split channels</text>
</g>
<g class="node" id="pad"><rect x="212" y="380" width="296" height="52" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="360" y="402.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Pad and unfold overlapping patches</text>
<text x="360" y="420.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Fold patch index into batch</text>
</g>
<g class="node" id="sc"><rect x="219" y="304" width="282" height="62" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="360" y="322.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">LayerNorm → patch self-attention</text>
<text x="360" y="340.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Scaled QKᵀ → Softmax → weight V</text>
<text x="360" y="358.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Output Linear and patch residual</text>
</g>
<g class="node" id="mlp"><rect x="206" y="242" width="308" height="46" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="360" y="261.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">LayerNorm → Linear → DW Conv 3×3</text>
<text x="360" y="279.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">GELU → Linear → residual add</text>
</g>
<g class="node" id="fold"><rect x="224.5" y="168" width="271" height="52" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="360" y="190.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Fold patches → divide by counts</text>
<text x="360" y="208.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Crop padding</text>
</g>
<g class="node" id="rep"><rect x="255.5" y="106" width="209" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="360" y="128.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Repeat patch block once</text>
</g>
<g class="node" id="out"><rect x="360" y="35" width="240" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="57.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Concat shortcut → Conv 1×1</text>
</g>
<text x="486" y="518" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--p">B×C×H×W</text>
<text x="434" y="445" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge p--pad">B×D×H×W</text>
<text x="366" y="236" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge mlp--fold">(BA)×P²×D</text>
<text x="366" y="159" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge fold--rep">B×D×H×W</text>
<text x="423" y="99" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge rep--out">B×D×H×W</text>
<text x="691" y="474" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge p--out">Other channel half</text>
</svg>
