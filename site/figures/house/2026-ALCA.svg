<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="stats" d="M 469 531 L 370 482" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="stats" data-to="cat" d="M 370 448 L 370 409" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="cat" data-to="c" d="M 370 357 L 370 326" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="c" data-to="a" d="M 370 274 L 469 243" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="x" data-to="a" d="M 491 531 L 801 505 L 801 248 L 491 243" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="a" data-to="sp" d="M 469 191 L 370 161" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="a" data-to="out" d="M 491 191 L 750 173 L 750 103 L 491 69" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="sp" data-to="out" d="M 370 109 L 469 69" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<g class="node" id="x"><rect x="402.5" y="531" width="155" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="553.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input features</text>
</g>
<g class="node" id="stats"><rect x="257" y="448" width="226" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="370" y="470.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Spatial mean, max, and std</text>
</g>
<g class="node" id="cat"><rect x="253" y="357" width="234" height="52" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="370" y="379.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Interleave three statistics</text>
<text x="370" y="397.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Keep each channel triplet together</text>
</g>
<g class="node" id="c"><rect x="255" y="274" width="230" height="52" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="370" y="296.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Grouped Conv 1×1 → ReLU</text>
<text x="370" y="314.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Conv 1×1 → Sigmoid</text>
</g>
<g class="node" id="a"><rect x="362.5" y="191" width="235" height="52" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="480" y="213.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Channel reweight plus input</text>
<text x="480" y="231.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">X ⊗ channel weight + X</text>
</g>
<g class="node" id="sp"><rect x="242.5" y="109" width="255" height="52" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="370" y="131.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Concat channel mean and max</text>
<text x="370" y="149.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Conv 3×3 → Sigmoid</text>
</g>
<g class="node" id="out"><rect x="379.5" y="35" width="201" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="57.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Apply spatial weights ⊗</text>
</g>
<text x="426" y="507" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--stats">B×C×H×W</text>
<text x="376" y="434" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge stats--cat">B×C×1×1 each</text>
<text x="376" y="347" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge cat--c">B×3C×1×1</text>
<text x="427" y="271" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge c--a">B×C×1×1</text>
<text x="660" y="529" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--a">Input bypass</text>
<text x="436" y="176" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge a--sp">B×C×H×W</text>
<text x="621" y="196" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge a--out">Channel-refined features</text>
<text x="436" y="96" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge sp--out">B×1×H×W</text>
</svg>
