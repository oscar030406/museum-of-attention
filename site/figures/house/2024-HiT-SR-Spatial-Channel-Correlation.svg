<text class="box" x="479" y="557" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Input grid</text>
</g>
<g class="node" id="p"><rect x="310.5" y="449.5" width="337" height="55" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text class="box" x="479" y="472.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Feature projection, partition windows</text>
<text class="box" x="479" y="491.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Split projected Q and V into heads</text>
</g>
<g class="node" id="spa"><rect x="159" y="338.5" width="232" height="55" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="275" y="361.5" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Compress V spatially</text>
<text class="box" x="275" y="380.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Linear L → M in groups</text>
</g>
<g class="node" id="cha"><rect x="575" y="348" width="264" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="707" y="371" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Merge heads for each token</text>
</g>
<g class="node" id="s"><rect x="146" y="230" width="258" height="74" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="275" y="253" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Spatial correlation</text>
<text class="box" x="275" y="272" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">QVᵀ / scale + position bias</text>
<text class="box" x="275" y="291" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Multiply by compressed V</text>
</g>
<g class="node" id="c"><rect x="594.5" y="230" width="225" height="74" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="707" y="253" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Channel correlation</text>
<text class="box" x="707" y="272" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">QᵀV / L</text>
<text class="box" x="707" y="291" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Multiply by Vᵀ</text>
</g>
<g class="node" id="merge"><rect x="305.5" y="129" width="347" height="36" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text class="box" x="479" y="152" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Rejoin grids and concatenate channels</text>
</g>
<g class="node" id="out"><rect x="362" y="35" width="234" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="479" y="58" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Linear output projection</text>
</g>
