<text class="edge s--merge" x="340" y="210" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">Bᵥ×L×(C/2)</text>
<text class="edge c--merge" x="654" y="195" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">Bᵥ×L×(C/2)</text>
<text class="edge merge--out" x="485" y="104" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">B×H×W×C</text>
</svg>
