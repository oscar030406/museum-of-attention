<g class="node" id="x"><rect x="391" y="526" width="160" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="471" y="552.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input features</text>
</g>
<g class="node" id="c"><rect x="303.5" y="420" width="291" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="449" y="444.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Split channels, cascade Conv 3×3</text>
<text x="449" y="462.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Add previous group output, then Conv + BN</text>
</g>
<g class="node" id="p"><rect x="211" y="320" width="242" height="56" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="332" y="344.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Average pool each group</text>
<text x="332" y="362.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">1×1 and 2×2 bins, flatten and join</text>
</g>
<g class="node" id="w"><rect x="209" y="221" width="246" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="332" y="245.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Shared channel projection</text>
<text x="332" y="263.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Conv 1×1, ReLU, Conv 1×1, Sigmoid</text>
</g>
<g class="node" id="s"><rect x="219" y="128" width="226" height="42" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="332" y="154.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Softmax across groups</text>
</g>
<g class="node" id="y"><rect x="337" y="29" width="264" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="469" y="55.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Scale groups + concat channels</text>
</g>
<text x="468" y="506" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--c">B×(gC)×H×W</text>
<text x="394" y="393" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge c--p">Per group: B×C×H×W</text>
<text x="612" y="425" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge c--y">B×g×C×H×W</text>
<text x="338" y="304" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge p--w">B×5C×1×1</text>
<text x="338" y="201" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge w--s">B×g×C×1×1 after stack</text>
<text x="404" y="107" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge s--y">B×g×C×1×1</text>
</svg>
