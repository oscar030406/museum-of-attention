<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="proj" d="M 440 531 L 430 475" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="p" data-to="qk" d="M 770 531 L 770 457 L 441 367" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="proj" data-to="qk" d="M 441 423 L 419 367" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="proj" data-to="mix" d="M 419 423 L 235 418 L 235 173 L 489 168" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="qk" data-to="sc" d="M 430 333 L 430 285" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="sc" data-to="mix" d="M 430 215 L 511 168" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="mix" data-to="out" d="M 500 134 L 500 69" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<g class="node" id="x"><rect x="378.5" y="531" width="123" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="440" y="553.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Image tokens</text>
</g>
<g class="node" id="p"><rect x="695.5" y="531" width="149" height="34" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="770" y="553.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">2D rotary factors</text>
</g>
<g class="node" id="proj"><rect x="312.5" y="423" width="235" height="52" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="430" y="445.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Fused Linear → split Q, K, V</text>
<text x="430" y="463.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">More query heads than KV heads</text>
</g>
<g class="node" id="qk"><rect x="319" y="333" width="222" height="34" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="430" y="355.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Apply 2D RoPE to Q and K</text>
</g>
<g class="node" id="sc"><rect x="304.5" y="215" width="251" height="70" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="430" y="237.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Repeat K heads → scaled QKᵀ</text>
<text x="430" y="255.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Apply supplied mask or causal mask</text>
<text x="430" y="273.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Softmax then training dropout</text>
</g>
<g class="node" id="mix"><rect x="385" y="134" width="230" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="500" y="156.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Repeat V heads → weight V</text>
</g>
<g class="node" id="out"><rect x="360.5" y="35" width="279" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="500" y="57.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Merge heads → Linear → Dropout</text>
</g>
<text x="442" y="509" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--proj">B×T×C</text>
<text x="776" y="499" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge p--qk">T×D/2×2</text>
<text x="438" y="401" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge proj--qk">Q, K</text>
<text x="338" y="414" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge proj--mix">V: B×g×S×D</text>
<text x="436" y="314" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge qk--sc">Q: B×h×T×D</text>
<text x="483" y="196" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge sc--mix">B×h×T×S</text>
<text x="506" y="107" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge mix--out">B×T×C</text>
</svg>
