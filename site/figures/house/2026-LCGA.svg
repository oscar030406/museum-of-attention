<text x="475" y="119.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Weight V → Undo window layout</text>
<text x="475" y="137.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Undo shifts, crop and concat</text>
</g>
<g class="node" id="y"><rect x="472.5" y="26" width="195" height="52" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="570" y="48.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Add depthwise V ⊕</text>
<text x="570" y="66.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Linear → Dropout → Output</text>
</g>
<text x="471" y="518" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--p">B×L×C</text>
<text x="431" y="448" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge p--w">Each B×L×C</text>
<text x="647" y="457" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge p--l">V</text>
<text x="413" y="375" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge w--q">Each B×L′×C/2</text>
<text x="438" y="304" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge q--s">Q, K: BG×h×T×d</text>
<text x="262" y="370" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge w--c">Q grid</text>
