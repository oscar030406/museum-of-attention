<text x="440" y="279.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Add shifted-window mask if used</text>
</g>
<g class="node" id="c"><rect x="46" y="239" width="202" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
