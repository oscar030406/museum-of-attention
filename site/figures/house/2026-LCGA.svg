<text x="177" y="222" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge c--a">BG×1×T×1</text>
<text x="540" y="324" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge q--m">V: BG×h×T×d</text>
<text x="461" y="164" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge a--m">BG×h×T×T</text>
<text x="557" y="93" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge m--y">B×L×C</text>
<text x="834" y="385" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge l--y">B×L×C</text>
</svg>
