<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-i" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="q" data-to="norm" d="M 140 532 L 138 453" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-g)"/>
<path class="flow" data-from="loc" data-to="sample" d="M 350 532 L 406 462.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-g)"/>
<path class="flow" data-from="past" data-to="sample" d="M 659 517.5 L 546 462.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="norm" data-to="rank" d="M 138 417 L 218 362" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-g)"/>
<path class="flow" data-from="sample" data-to="rank" d="M 393 407.5 L 354 362" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="sample" data-to="gather" d="M 541 407.5 L 658 378 L 658 270 L 656 244.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="rank" data-to="gather" d="M 350 288 L 514 244.5" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<path class="flow" data-from="rank" data-to="gain" d="M 232 288 L 226 235" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<path class="flow" data-from="gather" data-to="mix" d="M 596 189.5 L 550 142.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="gain" data-to="mix" d="M 226 199 L 410 142.5" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<path class="flow" data-from="mix" data-to="out" d="M 480 87.5 L 480 63" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<path class="flow" data-from="anchor" data-to="out" d="M 791 98 L 547 63" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<g class="node" id="q"><rect x="45.5" y="532" width="189" height="36" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="140" y="555" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Current feature map</text>
</g>
<g class="node" id="loc"><rect x="251" y="532" width="198" height="36" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="350" y="555" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Trajectory locations</text>
</g>
<g class="node" id="past"><rect x="520.5" y="517.5" width="277" height="55" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="659" y="540.5" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Past index and value maps</text>
<text class="box" x="659" y="559.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">One key map, three value scales</text>
</g>
<g class="node" id="norm"><rect x="25.5" y="417" width="225" height="36" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="138" y="440" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Unfold and L2-normalize</text>
</g>
<g class="node" id="sample"><rect x="337.5" y="407.5" width="277" height="55" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="476" y="430.5" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Normalize grid coordinates</text>
<text class="box" x="476" y="449.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Nearest sample along trajectories</text>
</g>
<g class="node" id="rank"><rect x="160.5" y="288" width="259" height="74" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="290" y="311" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Normalize keys and score </text>
<text class="box" x="290" y="330" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Cosine for each trajectory time</text>
<text class="box" x="290" y="349" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Take max over time</text>
</g>
<g class="node" id="gather"><rect x="437" y="189.5" width="318" height="55" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="596" y="212.5" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Gather all three scales at argmax</text>
<text class="box" x="596" y="231.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Fold each scale to the grid</text>
</g>
<g class="node" id="gain"><rect x="113.5" y="199" width="225" height="36" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="226" y="222" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Fold max scores to grid</text>
</g>
<g class="node" id="mix"><rect x="354.5" y="87.5" width="251" height="55" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="480" y="110.5" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Concatenate and fuse scales</text>
<text class="box" x="480" y="129.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Multiply by max score map</text>
</g>
<g class="node" id="anchor"><rect x="714" y="98" width="154" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="791" y="121" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Anchor features</text>
</g>
<g class="node" id="out"><rect x="385.5" y="27" width="189" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="480" y="50" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Add anchor features</text>
</g>
<text class="edge q--norm" x="145" y="497" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">B×C×H×W</text>
<text class="edge loc--sample" x="384" y="502" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">B×2T×H′×W′</text>
<text class="edge past--sample" x="614" y="487" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">B×T×D×H′×W′</text>
<text class="edge norm--rank" x="185" y="398" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">B×N×D</text>
<text class="edge sample--rank" x="383" y="390" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">Sampled keys</text>
<text class="edge sample--gather" x="615" y="403" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">Sampled values</text>
<text class="edge rank--gather" x="448" y="277" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">Argmax: B×N</text>
<text class="edge rank--gain" x="236" y="267" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">Max: B×N</text>
<text class="edge gather--mix" x="579" y="171" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">3 maps, B×C×H×W</text>
<text class="edge gain--mix" x="323" y="184" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">B×C×H×W</text>
</svg>
