<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="pos" data-to="limit" d="M 291 531 L 459 475" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="config" data-to="limit" d="M 700 522 L 481 475" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="limit" data-to="freq" d="M 470 423 L 470 376" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="pos" data-to="phase" d="M 269 531 L 240 494 L 240 281 L 459 276" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="freq" data-to="phase" d="M 470 324 L 481 276" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="phase" data-to="trig" d="M 470 224 L 470 177" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="trig" data-to="out" d="M 470 125 L 470 69" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<g class="node" id="pos"><rect x="223.5" y="531" width="113" height="34" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="280" y="553.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Position IDs</text>
</g>
<g class="node" id="config"><rect x="587" y="522" width="226" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="700" y="544.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Base and frequency scales</text>
<text x="700" y="562.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Original context limit</text>
</g>
<g class="node" id="limit"><rect x="362" y="423" width="216" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="470" y="445.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Measure max position + 1</text>
<text x="470" y="463.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Select short or long factors</text>
</g>
<g class="node" id="freq"><rect x="347.5" y="324" width="245" height="52" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="470" y="346.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Compute inverse frequencies</text>
<text x="470" y="364.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">1 / (factor ⊗ base^(2i/D))</text>
</g>
<g class="node" id="phase"><rect x="360.5" y="224" width="219" height="52" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="470" y="246.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Multiply by position</text>
<text x="470" y="264.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Duplicate half-dimension angles</text>
</g>
<g class="node" id="trig"><rect x="370" y="125" width="200" height="52" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="470" y="147.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Cosine and sine</text>
<text x="470" y="165.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Scale and cast to input dtype</text>
</g>
<g class="node" id="out"><rect x="405.5" y="35" width="129" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="470" y="57.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Rotary factors</text>
</g>
<text x="387" y="511" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge pos--limit">B×T</text>
<text x="476" y="405" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge limit--freq">D/2 scale factors</text>
<text x="263" y="516" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge pos--phase">B×T</text>
<text x="484" y="303" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge freq--phase">D/2</text>
<text x="476" y="206" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge phase--trig">B×T×D</text>
<text x="476" y="102" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge trig--out">B×T×D each</text>
</svg>
