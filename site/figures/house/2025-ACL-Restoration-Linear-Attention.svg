<path class="flow" data-from="pos" data-to="out" d="M 590 481 L 885 454 L 885 88 L 694 57" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
