<g class="node" id="in"><rect x="402.5" y="529" width="155" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="555.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Image tokens</text>
</g>
<g class="node" id="pos"><rect x="323" y="481" width="314" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="480" y="503.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Add depthwise Conv 3×3 position term</text>
</g>
<g class="node" id="norm"><rect x="412" y="429" width="136" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="480" y="451.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">LayerNorm</text>
</g>
<g class="node" id="conv"><rect x="188" y="354" width="238" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="307" y="378.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Linear + depthwise Conv 3×3</text>
<text x="307" y="396.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">SiLU gives attention input X</text>
</g>
<g class="node" id="gate"><rect x="635" y="150" width="174" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="722" y="174.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Linear + SiLU</text>
<text x="722" y="192.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Output gate</text>
</g>
<g class="node" id="qk"><rect x="91.5" y="272" width="219" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="201" y="296.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Linear → Q, K</text>
<text x="201" y="314.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">ELU + 1, split into heads</text>
</g>
<g class="node" id="kv"><rect x="259.5" y="197" width="193" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="356" y="221.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Compact KV product</text>
<text x="356" y="239.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">KᵀV / N, with V = X</text>
</g>
<g class="node" id="read"><rect x="91.5" y="121" width="235" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="209" y="145.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Normalized linear readout</text>
<text x="209" y="163.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Q(KᵀV / N) / (Q mean(K)ᵀ + ε)</text>
</g>
<g class="node" id="lepe"><rect x="390.5" y="121" width="215" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="498" y="145.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Local position term</text>
<text x="498" y="163.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Depthwise Conv 3×3 on V</text>
</g>
<g class="node" id="fuse"><rect x="300.5" y="70" width="251" height="36" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="426" y="93.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Add position term, gate, Linear</text>
</g>
<g class="node" id="out"><rect x="300.5" y="25" width="437" height="32" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="519" y="46.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Add skip, second position term, residual MLP</text>
</g>
<text x="486" y="477" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge pos--norm">B×N×C</text>
<text x="430" y="418" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge norm--conv">B×N×C</text>
<text x="246" y="346" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge conv--qk">B×N×C</text>
<text x="362" y="332" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge conv--kv">V: B×h×N×d</text>
<text x="463" y="337" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge conv--lepe">V: B×N×C</text>
<text x="310" y="269" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge qk--kv">K: B×h×N×d</text>
<text x="160" y="230" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge qk--read">Q, K: B×h×N×d</text>
<text x="329" y="184" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge kv--read">B×h×d×d</text>
<text x="252" y="108" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge read--fuse">B×N×C</text>
<text x="606" y="137" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge gate--fuse">B×N×C</text>
</svg>
