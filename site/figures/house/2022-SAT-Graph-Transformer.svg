<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="s" d="M 459 531 L 300 475" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="x" data-to="v" d="M 481 531 L 710 466" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="s" data-to="p" d="M 300 423 L 300 376" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="p" data-to="sc" d="M 300 324 L 375 276" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="v" data-to="mix" d="M 710 432 L 710 410 L 710 183 L 511 168" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="sc" data-to="mix" d="M 375 224 L 489 168" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="mix" data-to="out" d="M 500 134 L 500 69" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<g class="node" id="x"><rect x="343.5" y="531" width="253" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="470" y="553.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input nodes and graph indices</text>
</g>
<g class="node" id="s"><rect x="167" y="423" width="266" height="52" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="300" y="445.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Extract neighborhood features</text>
<text x="300" y="463.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">GCN subtree or pooled k-hop subgraph</text>
</g>
<g class="node" id="v"><rect x="588" y="432" width="244" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="710" y="454.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Project V from original nodes</text>
</g>
<g class="node" id="p"><rect x="208" y="324" width="184" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="300" y="346.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Project Q and K</text>
<text x="300" y="364.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Optional shared projection</text>
</g>
<g class="node" id="sc"><rect x="257.5" y="224" width="235" height="52" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="375" y="246.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Scaled dot products</text>
<text x="375" y="264.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Softmax over each node&#x27;s sources</text>
</g>
<g class="node" id="mix"><rect x="372.5" y="134" width="255" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="500" y="156.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Weight and sum source values</text>
</g>
<g class="node" id="out"><rect x="377" y="35" width="246" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="500" y="57.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Merge heads → output Linear</text>
</g>
<text x="397" y="505" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--s">N×C</text>
<text x="604" y="511" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--v">N×C</text>
<text x="306" y="405" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge s--p">N×C</text>
<text x="353" y="309" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge p--sc">N×h×D (Q, K)</text>
<text x="716" y="426" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge v--mix">V: N×h×D</text>
<text x="443" y="209" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge sc--mix">E×h for edge list</text>
<text x="506" y="107" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge mix--out">N×C</text>
</svg>
