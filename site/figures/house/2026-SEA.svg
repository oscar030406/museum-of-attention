<text x="737" y="379.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Linear on V across channels</text>
<text x="737" y="397.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">GELU per location</text>
</g>
