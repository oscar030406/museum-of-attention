<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="q" d="M 458 522 L 270 494" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="x" data-to="c" d="M 480 522 L 690 494" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="q" data-to="sc" d="M 281 460 L 270 432" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="q" data-to="mix" d="M 259 460 L 113 433 L 113 357 L 259 352" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="sc" data-to="mix" d="M 270 380 L 281 352" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="c" data-to="g" d="M 690 460 L 690 441" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="g" data-to="cp" d="M 690 371 L 690 352" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="mix" data-to="cat" d="M 270 318 L 469 282" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="cp" data-to="cat" d="M 690 318 L 491 282" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="cat" data-to="conv" d="M 480 248 L 480 220" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path class="flow" data-from="conv" data-to="add" d="M 480 168 L 469 149" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="x" data-to="add" d="M 502 522 L 908 500 L 908 154 L 491 149" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="add" data-to="out" d="M 480 97 L 480 69" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<g class="node" id="x"><rect x="361" y="522" width="238" height="52" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="544.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input frames</text>
<text x="480" y="562.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Optional initial feed-forward update</text>
</g>
<g class="node" id="q"><rect x="150" y="460" width="240" height="34" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="270" y="482.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">LayerNorm → project Q, K, V</text>
</g>
<g class="node" id="c"><rect x="566.5" y="460" width="247" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="690" y="482.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">LayerNorm → Linear → GELU</text>
</g>
<g class="node" id="sc"><rect x="131" y="380" width="278" height="52" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="270" y="402.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Content + relative position scores</text>
<text x="270" y="420.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Scale → mask → Softmax</text>
</g>
<g class="node" id="g"><rect x="575.5" y="371" width="229" height="70" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="690" y="393.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Split signal and gate</text>
<text x="690" y="411.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">LayerNorm → depthwise Conv1D</text>
<text x="690" y="429.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Multiply gate and signal</text>
</g>
<g class="node" id="mix"><rect x="189" y="318" width="162" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="270" y="340.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Weight V → Linear</text>
</g>
<g class="node" id="cp"><rect x="600.5" y="318" width="179" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="690" y="340.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Project gated frames</text>
</g>
<g class="node" id="cat"><rect x="399.5" y="248" width="161" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="480" y="270.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Concat both paths</text>
</g>
<g class="node" id="conv"><rect x="338.5" y="168" width="283" height="52" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="190.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Depthwise Conv1D after pad mask</text>
<text x="480" y="208.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Add to concatenation → Linear</text>
</g>
<g class="node" id="add"><rect x="361" y="97" width="238" height="52" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="480" y="119.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Residual add</text>
<text x="480" y="137.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Optional final feed-forward → norm</text>
</g>
<g class="node" id="out"><rect x="415" y="35" width="130" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="480" y="57.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Output frames</text>
</g>
<text x="376" y="507" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--q">B×T×C</text>
<text x="285" y="451" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge q--sc">Q, K</text>
<text x="186" y="374" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge q--mix">V: B×h×T×D</text>
<text x="285" y="371" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge sc--mix">B×h×T×T</text>
<text x="696" y="456" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge c--g">B×T×U</text>
<text x="696" y="367" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge g--cp">B×T×U/2</text>
<text x="374" y="312" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge mix--cat">B×T×C</text>
<text x="595" y="298" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge cp--cat">B×T×C</text>
<text x="486" y="239" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge cat--conv">B×T×2C</text>
<text x="712" y="526" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--add">Frame residual</text>
<text x="486" y="88" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge add--out">B×T×C</text>
</svg>
