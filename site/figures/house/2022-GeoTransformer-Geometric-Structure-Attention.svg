<g class="node" id="pts"><rect x="219.5" y="532" width="171" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="305" y="555" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Point coordinates</text>
</g>
<g class="node" id="x"><rect x="674.5" y="532" width="145" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="747" y="555" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Point features</text>
</g>
<g class="node" id="dist"><rect x="59.5" y="421.5" width="235" height="55" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text class="box" x="177" y="444.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Pairwise distance</text>
<text class="box" x="177" y="463.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Scale, sinusoidal code, Linear</text>
</g>
