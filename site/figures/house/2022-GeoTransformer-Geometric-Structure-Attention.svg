<text class="box" x="446" y="220" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Add content and geometric scores</text>
<text class="box" x="446" y="239" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">(qᵢ·kⱼ + qᵢ·pᵢⱼ) / √d</text>
<text class="box" x="446" y="258" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Optional mask → Softmax</text>
</g>
