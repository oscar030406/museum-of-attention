<text class="box" x="314" y="339.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Add distance and angle codes</text>
<text class="box" x="314" y="358.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Project positional feature P</text>
</g>
<g class="node" id="proj"><rect x="661.5" y="326" width="171" height="36" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
