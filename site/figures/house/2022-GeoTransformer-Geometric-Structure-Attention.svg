<text class="box" x="451" y="444.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Angles to k nearest neighbors</text>
<text class="box" x="451" y="463.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Sinusoidal code, Linear, max or mean</text>
</g>
