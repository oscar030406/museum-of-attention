<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="p" d="M 465 526 L 465 492" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="p" data-to="s" d="M 452 436 L 347 409" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="p" data-to="m" d="M 478 436 L 749 414 L 749 245 L 479 237" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="s" data-to="t" d="M 347 353 L 347 326" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="t" data-to="m" d="M 347 270 L 453 237" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="m" data-to="b" d="M 466 195 L 466 154" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="b" data-to="y" d="M 466 112 L 466 71" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<g class="node" id="x"><rect x="384" y="526" width="162" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="465" y="552.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input features</text>
</g>
<g class="node" id="p"><rect x="335" y="436" width="260" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="465" y="460.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Conv 1×1 + DW Conv 3×3</text>
<text x="465" y="478.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Split Q, K, V and arrange heads</text>
</g>
<g class="node" id="s"><rect x="222" y="353" width="250" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="347" y="377.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Channel scores</text>
<text x="347" y="395.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Spatial L2 norm + temperature × QKᵀ</text>
</g>
<g class="node" id="t"><rect x="216.5" y="270" width="261" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="347" y="294.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Four top-k masks + Softmax</text>
<text x="347" y="312.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Keep 1/2, 2/3, 3/4, 4/5 per row</text>
</g>
<g class="node" id="m"><rect x="350.5" y="195" width="231" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="466" y="221.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Mix V with each weight map</text>
</g>
<g class="node" id="b"><rect x="350.5" y="112" width="231" height="42" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="466" y="138.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Learned sum of four mixes</text>
</g>
<g class="node" id="y"><rect x="350" y="29" width="232" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="466" y="55.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Restore map + Conv 1×1</text>
</g>
<text x="471" y="514" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--p">B×C×H×W</text>
<text x="409" y="422" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge p--s">Q, K: B×h×d×HW</text>
<text x="622" y="437" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge p--m">V: B×h×d×HW</text>
<text x="353" y="345" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge s--t">B×h×d×d</text>
<text x="414" y="263" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge t--m">4 × (B×h×d×d)</text>
<text x="472" y="180" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge m--b">4 × (B×h×d×HW)</text>
<text x="472" y="97" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge b--y">B×h×d×HW</text>
</svg>
