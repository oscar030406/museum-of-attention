<path class="flow" data-from="q" data-to="s" d="M 309 436 L 196 408 L 196 251 L 362 244" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
