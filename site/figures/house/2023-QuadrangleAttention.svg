<path class="flow" data-from="s" data-to="m" d="M 375 188 L 483 154" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="m" data-to="y" d="M 496 112 L 496 71" fill="none" stroke="#17140f" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<g class="node" id="x"><rect x="332.5" y="526" width="229" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="447" y="552.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input tokens to feature grid</text>
</g>
<g class="node" id="q"><rect x="206" y="436" width="232" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="322" y="460.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Conv 1×1 QKV + pad</text>
<text x="322" y="478.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Split heads into Q, K and V</text>
</g>
<g class="node" id="t"><rect x="535.5" y="436" width="273" height="56" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="672" y="460.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Pool each window + Conv 1×1</text>
<text x="672" y="478.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">LeakyReLU before projection</text>
</g>
<g class="node" id="p"><rect x="536" y="344.5" width="272" height="73" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="672" y="368.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Projective sampling grid</text>
<text x="672" y="386.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Apply rotation, shear, scale, and shift</text>
<text x="672" y="404.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Perspective divide about window center</text>
</g>
<g class="node" id="r"><rect x="390" y="270" width="264" height="56" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="522" y="294.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Bilinear sample K and V</text>
<text x="522" y="312.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Group samples by head and window</text>
</g>
<g class="node" id="s"><rect x="246.5" y="188" width="257" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="375" y="212.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Scaled scores + position terms</text>
<text x="375" y="230.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Softmax within each window</text>
</g>
<g class="node" id="m"><rect x="385.5" y="112" width="221" height="42" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="496" y="138.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Mix sampled values</text>
</g>
<g class="node" id="y"><rect x="371.5" y="29" width="249" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="496" y="55.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Stitch windows, crop + Linear</text>
</g>
<text x="387" y="507" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--q">B×C×H×W</text>
<text x="678" y="432" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge t--p">B×h×nW×9</text>
<text x="411" y="403" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge q--r">K, V on padded grid</text>
<text x="658" y="334" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge p--r">Coordinates: B×h×H′×W′×2</text>
<text x="230" y="407" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge q--s">Q in regular windows</text>
<text x="467" y="257" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge r--s">K: Bᵥ×h×N×d</text>
<text x="643" y="259" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge r--m">V: Bᵥ×h×N×d</text>
<text x="437" y="183" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge s--m">Bᵥ×h×N×N</text>
<text x="502" y="97" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge m--y">Bᵥ×h×N×d</text>
</svg>
