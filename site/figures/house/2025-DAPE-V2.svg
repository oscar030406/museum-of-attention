<path class="flow" data-from="a" data-to="add" d="M 691 522 L 808 484 L 808 181 L 492 168" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
