<text x="320" y="553.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Input scores</text>
</g>
<g class="node" id="a"><rect x="574.5" y="522" width="211" height="52" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="680" y="544.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Build or slice ALiBi bias</text>
<text x="680" y="562.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Relative distance × head slope</text>
</g>
<g class="node" id="cat"><rect x="351" y="423" width="238" height="52" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="470" y="445.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Concat scores and tiled bias</text>
<text x="470" y="463.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Keep lower triangle</text>
</g>
<g class="node" id="c1"><rect x="368" y="333" width="204" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="470" y="355.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Conv 1×k → LeakyReLU</text>
</g>
<g class="node" id="c2"><rect x="424" y="233" width="92" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="470" y="255.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Conv 1×k</text>
</g>
<g class="node" id="add"><rect x="329.5" y="134" width="281" height="34" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="470" y="156.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Add scores, bias and correction ⊕</text>
</g>
<g class="node" id="out"><rect x="397.5" y="35" width="145" height="34" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
