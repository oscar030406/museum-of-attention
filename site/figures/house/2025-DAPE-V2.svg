</g>
<text x="408" y="511" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge x--cat">B×h×Q×K</text>
<text x="590" y="499" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge a--cat">h×Q×K</text>
<text x="476" y="400" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge cat--c1">B×2h×Q×K</text>
<text x="476" y="305" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge c1--c2">B×M×Q×K</text>
<text x="476" y="206" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge c2--add">B×h×Q×K</text>
<text x="240" y="507" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge x--add">Original scores</text>
<text x="757" y="514" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge a--add">Position bias</text>
<text x="476" y="107" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge add--out">B×h×Q×K</text>
