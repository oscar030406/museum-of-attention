<path class="flow" data-from="q" data-to="score" d="M 669 337.5 L 648 221.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-g)"/>
<path class="flow" data-from="expand" data-to="mix" d="M 819 442 L 905 414 L 905 158 L 603 140.5" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-g)"/>
<path class="flow" data-from="kv" data-to="score" d="M 427 249.5 L 501 221.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="kv" data-to="mix" d="M 308 249.5 L 388 140.5" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-b)"/>
<path class="flow" data-from="score" data-to="mix" d="M 581 166.5 L 541 140.5" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<path class="flow" data-from="mix" data-to="out" d="M 478 85.5 L 478 63" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-r)"/>
<g class="node" id="cls"><rect x="81" y="533" width="198" height="36" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="180" y="556" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Degradation label(s)</text>
</g>
<g class="node" id="x"><rect x="422.5" y="533" width="145" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="495" y="556" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Input features</text>
</g>
<g class="node" id="param"><rect x="680" y="533" width="246" height="36" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="803" y="556" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Learned restoration prompt</text>
</g>
<g class="node" id="expand"><rect x="652.5" y="442" width="189" height="36" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="747" y="465" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Repeat across batch</text>
</g>
<g class="node" id="sel"><rect x="49.5" y="432.5" width="261" height="55" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="180" y="455.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">One-hot or paired labels</text>
<text class="box" x="180" y="474.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Weight and average task prompts</text>
</g>
<g class="node" id="resize"><rect x="353.5" y="432.5" width="265" height="55" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text class="box" x="486" y="455.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">Resize and align channels</text>
<text class="box" x="486" y="474.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Bilinear, then crop or zero-pad C</text>
</g>
<g class="node" id="combine"><rect x="254" y="347" width="216" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="362" y="370" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Task prompt ⊗ features</text>
</g>
<g class="node" id="kv"><rect x="233.5" y="249.5" width="257" height="55" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="362" y="272.5" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">LayerNorm → Conv K and V</text>
<text class="box" x="362" y="291.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Pointwise then depthwise</text>
</g>
<g class="node" id="q"><rect x="609" y="337.5" width="276" height="55" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text class="box" x="747" y="360.5" text-anchor="middle" font-size="16" font-weight="600" fill="#17140f">LayerNorm → Conv Q</text>
<text class="box" x="747" y="379.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Pointwise then depthwise</text>
</g>
<g class="node" id="score"><rect x="429" y="166.5" width="304" height="55" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="581" y="189.5" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">L2-normalize Q and K over pixels</text>
<text class="box" x="581" y="208.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Temperature × QKᵀ → Softmax</text>
</g>
<g class="node" id="mix"><rect x="317" y="85.5" width="322" height="55" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text class="box" x="478" y="108.5" text-anchor="middle" font-size="16" font-weight="600" fill="#7d1a2b">Mix V across channels and project</text>
<text class="box" x="478" y="127.5" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Add query input, residual FFN</text>
</g>
<g class="node" id="out"><rect x="370" y="27" width="216" height="36" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text class="box" x="478" y="50" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3c73">Resize back → Conv 3×3</text>
</g>
<text class="edge cls--sel" x="186" y="514" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">One or two labels</text>
<text class="edge x--resize" x="497" y="515" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">B×C×H×W</text>
<text class="edge sel--combine" x="253" y="417" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">B×D×1×1</text>
<text class="edge resize--combine" x="467" y="409" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">B×D×S×S</text>
<text class="edge combine--kv" x="368" y="330" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">B×D×S×S</text>
<text class="edge param--expand" x="786" y="508" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">1×D×S×S</text>
<text class="edge expand--q" x="723" y="422" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">B×D×S×S</text>
<text class="edge q--score" x="665" y="285" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">Q: B×h×d×S²</text>
<text class="edge expand--mix" x="754" y="147" text-anchor="start" font-size="14" font-weight="400" fill="#17140f">Query input bypass</text>
<text class="edge kv--score" x="477" y="243" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">K: B×h×d×S²</text>
<text class="edge kv--mix" x="346" y="211" text-anchor="start" font-size="14" font-weight="400" fill="#1f3c73">V: B×h×d×S²</text>
<text class="edge score--mix" x="566" y="155" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">B×h×d×d</text>
<text class="edge mix--out" x="484" y="78" text-anchor="start" font-size="14" font-weight="400" fill="#7d1a2b">B×D×S×S</text>
<text class="note" x="689" y="51" text-anchor="middle" font-size="14" font-weight="400" fill="#17140f">Output: B×D×H×W</text>
</svg>
