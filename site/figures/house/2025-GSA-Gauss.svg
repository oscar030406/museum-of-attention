<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Archivo, Arial, sans-serif">
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17140f"/></marker>
<marker id="arrow-feature" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f3c73"/></marker>
<marker id="arrow-score" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7d1a2b"/></marker>
<marker id="arrow-gate" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 8"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b8892b"/></marker>
</defs>
<path class="flow" data-from="x" data-to="pool" d="M 412 513 L 369 467" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="x" data-to="m" d="M 467 513 L 730 466 L 730 157 L 535 127" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="pool" data-to="peak" d="M 369 425 L 369 377" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<path class="flow" data-from="peak" data-to="pdf" d="M 369 335 L 369 291" fill="none" stroke="#b8892b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-gate)"/>
<path class="flow" data-from="pdf" data-to="bn" d="M 369 235 L 369 199" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="bn" data-to="m" d="M 369 157 L 439 127" fill="none" stroke="#7d1a2b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-score)"/>
<path class="flow" data-from="m" data-to="out" d="M 477 85 L 477 61" fill="none" stroke="#1f3c73" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-feature)"/>
<g class="node" id="x"><rect x="335" y="513" width="154" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="412" y="539.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input features</text>
</g>
<g class="node" id="pool"><rect x="243" y="425" width="252" height="42" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="369" y="451.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Channel mean + channel max</text>
</g>
<g class="node" id="peak"><rect x="247" y="335" width="244" height="42" rx="3" fill="#f4efe2" stroke="#b8892b" stroke-width="1.8"/>
<text x="369" y="361.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Find peak → Grid coordinates</text>
</g>
<g class="node" id="pdf"><rect x="228" y="235" width="282" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="369" y="259.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">2D Gaussian density</text>
<text x="369" y="277.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Center from peak, scales from map size</text>
</g>
<g class="node" id="bn"><rect x="258.5" y="157" width="221" height="42" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="369" y="183.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Stack maps → BatchNorm</text>
</g>
<g class="node" id="m"><rect x="395.5" y="85" width="163" height="42" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="477" y="111.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Weight input map</text>
</g>
<g class="node" id="out"><rect x="392" y="27" width="170" height="34" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="477" y="49.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Output features</text>
</g>
<text x="401" y="492" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--pool">B×C×H×W</text>
<text x="736" y="325" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--m">Input bypass</text>
<text x="375" y="406" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge pool--peak">B×1×H×W</text>
<text x="375" y="318" font-size="14" fill="#17140f" text-anchor="start" font-weight="400" class="edge peak--pdf">B×2</text>
<text x="375" y="215" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge pdf--bn">One H×W map per sample</text>
<text x="324" y="139" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge bn--m">B×1×H×W</text>
<text x="483" y="75" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge m--out">B×C×H×W</text>
</svg>
