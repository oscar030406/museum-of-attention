<g class="node" id="x"><rect x="381.5" y="526" width="185" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="474" y="552.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Input features</text>
</g>
