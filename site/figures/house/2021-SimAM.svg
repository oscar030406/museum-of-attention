<text x="364" y="444.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Center each channel + square</text>
<text x="364" y="462.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">D = (X − spatial mean)²</text>
</g>
<g class="node" id="v"><rect x="142.5" y="320" width="225" height="56" rx="3" fill="#f4efe2" stroke="#17140f" stroke-width="1.8"/>
<text x="255" y="344.0" font-size="16" fill="#17140f" text-anchor="middle" font-weight="600" class="box">Sum squared deviations</text>
<text x="255" y="362.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">Divide by HW − 1, add λ</text>
</g>
<g class="node" id="y"><rect x="273" y="221" width="220" height="56" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="383" y="245.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Energy score</text>
<text x="383" y="263.0" font-size="14" fill="#17140f" text-anchor="middle" font-weight="400" class="box">D / (4 × adjusted variance) + 0.5</text>
</g>
<g class="node" id="s"><rect x="286" y="128" width="194" height="42" rx="3" fill="#dfd7c4" stroke="#7d1a2b" stroke-width="1.8"/>
<text x="383" y="154.0" font-size="16" fill="#7d1a2b" text-anchor="middle" font-weight="600" class="box">Sigmoid weights</text>
</g>
<g class="node" id="o"><rect x="396.5" y="29" width="211" height="42" rx="3" fill="#f4efe2" stroke="#1f3c73" stroke-width="1.8"/>
<text x="502" y="55.0" font-size="16" fill="#1f3c73" text-anchor="middle" font-weight="600" class="box">Scale each input element</text>
</g>
<text x="428" y="507" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--d">B×C×H×W</text>
<text x="676" y="517" font-size="14" fill="#1f3c73" text-anchor="start" font-weight="400" class="edge x--o">Input bypass</text>
