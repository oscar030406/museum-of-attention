<text x="389" y="201" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge y--s">B×C×H×W</text>
<text x="444" y="107" font-size="14" fill="#7d1a2b" text-anchor="start" font-weight="400" class="edge s--o">B×C×H×W</text>
