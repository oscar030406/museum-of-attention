# 注意力博物馆：纯静态站点，文件在 /xp/www/attention。
server {
    listen 80;
    server_name attention.chenmingkun.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name attention.chenmingkun.cn;

    ssl_certificate /etc/letsencrypt/live/attention.chenmingkun.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attention.chenmingkun.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /xp/www/attention;
    index index.html;

    # 全局 gzip 不含 JSON 和 SVG，数据文件 4 MB、玫瑰窗 360 KB，在这个站补上
    gzip_types text/plain application/javascript text/css application/json image/svg+xml;
    gzip_comp_level 5;

    # 数据和页面每次向服务器确认，改了馆藏马上能看到
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /data/ { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "no-cache"; }
    location /figures/ { expires 7d; }

    location / {
        try_files $uri $uri/ =404;
    }
}
